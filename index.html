/* =====================================================================
   FX — pooled beams, lightning, rings and flashes (visual only)
   ===================================================================== */
const Fx = (() => {
  const segGeo = new THREE.BoxGeometry(1, 1, 1).translate(0, 0, 0.5);
  const ringGeos = { thin: new THREE.RingGeometry(0.95, 1, 64), thick: new THREE.RingGeometry(0.8, 1, 64) };
  const live = [];
  const pools = { seg: [], thin: [], thick: [], flash: [], disc: [] };
  const addMat = () => new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
  function take(kind) {
    let m = pools[kind].pop();
    if (!m) {
      if (kind === 'seg') m = new THREE.Mesh(segGeo, addMat());
      else if (kind === 'flash') m = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
      else if (kind === 'disc') { m = new THREE.Mesh(new THREE.CircleGeometry(1, 40), addMat()); m.material.map = dotTex; m.rotation.x = -Math.PI / 2; }
      else { m = new THREE.Mesh(ringGeos[kind], addMat()); m.rotation.x = -Math.PI / 2; }
      m.frustumCulled = false;
      m.userData.kind = kind;
    }
    m.renderOrder = 8;
    m.visible = true;
    scene.add(m);
    return m;
  }
  const place = (m, a, b, w) => { m.position.copy(a); m.lookAt(b); m.scale.set(w, w, Math.max(0.001, a.distanceTo(b))); };
  const pts = [];
  return {
    place,
    makeSeg(color) { const m = new THREE.Mesh(segGeo, addMat()); m.material.color.set(color); m.frustumCulled = false; m.renderOrder = 8; return m; },
    seg(a, b, color, width, life, opacity = 1) {
      const m = take('seg');
      place(m, a, b, width);
      m.material.color.set(color);
      m.material.opacity = opacity;
      live.push({ m, life, max: life, op: opacity, type: 'fade' });
    },
    /* Jagged bolt: a bright core and a soft coloured glow */
    lightning(a, b, color, life = 0.14, jag = 0.13, op = 1) {
      const d = a.distanceTo(b);
      const n = Math.max(2, Math.round(d / 0.22));
      pts.length = 0;
      for (let i = 0; i <= n; i++) {
        const p = new THREE.Vector3().lerpVectors(a, b, i / n);
        if (i > 0 && i < n) { p.x += (Math.random() - 0.5) * jag * 2; p.y += (Math.random() - 0.5) * jag * 1.4; p.z += (Math.random() - 0.5) * jag * 2; }
        pts.push(p);
      }
      for (let i = 0; i < n; i++) {
        this.seg(pts[i], pts[i + 1], 0xeaf8ff, 0.028, life, op);
        this.seg(pts[i], pts[i + 1], color, 0.1, life, 0.5 * op);
      }
    },
    /* Ground ring that grows (or shrinks) from r0 to r1 */
    ring(at, r0, r1, color, life, { y = TILE_H + 0.03, opacity = 0.9, thick = false } = {}) {
      const m = take(thick ? 'thick' : 'thin');
      m.position.set(at.x, y, at.z);
      m.material.color.set(color);
      m.material.opacity = opacity;
      m.scale.setScalar(Math.max(0.01, r0));
      live.push({ m, life, max: life, op: opacity, type: 'ring', r0, r1 });
    },
    flash(at, color, size, life = 0.25) {
      const m = take('flash');
      m.position.copy(at);
      m.material.color.set(color);
      m.material.opacity = 1;
      m.scale.setScalar(size * 0.4);
      live.push({ m, life, max: life, op: 1, type: 'flash', size });
    },
    disc(at, radius, color, life, opacity = 0.7) {
      const m = take('disc');
      m.position.set(at.x, TILE_H + 0.02, at.z);
      m.material.color.set(color);
      m.material.opacity = opacity;
      m.scale.setScalar(radius * 0.4);
      live.push({ m, life, max: life, op: opacity, type: 'disc', size: radius });
    },
    update(dt) {
      for (let i = live.length - 1; i >= 0; i--) {
        const f = live[i];
        f.life -= dt;
        const k = 1 - Math.max(0, f.life) / f.max;   // 0 -> 1
        if (f.type === 'ring') { f.m.scale.setScalar(Math.max(0.01, f.r0 + (f.r1 - f.r0) * (1 - Math.pow(1 - k, 2)))); f.m.material.opacity = f.op * (1 - k); }
        else if (f.type === 'flash') { f.m.scale.setScalar(f.size * (0.4 + k * 0.9)); f.m.material.opacity = 1 - k; }
        else if (f.type === 'disc') { f.m.scale.setScalar(f.size * Math.min(1, 0.4 + k * 3)); f.m.material.opacity = f.op * (k < 0.8 ? 1 : (1 - k) / 0.2); }
        else f.m.material.opacity = f.op * (1 - k) * (Math.random() < 0.85 ? 1 : 0.4);
        if (f.life <= 0) { scene.remove(f.m); pools[f.m.userData.kind].push(f.m); live.splice(i, 1); }
      }
    },
    clear() { for (const f of live) { scene.remove(f.m); pools[f.m.userData.kind].push(f.m); } live.length = 0; },
  };
})();

/* ---------- Tower stats, buffs and upgrade costs ---------- */
const DAMAGE_TYPES = { pierce: 'Pierce', magic: 'Magic', energy: 'Energy', blast: 'Blast' };
const TARGETING = [['first', 'First', 'Furthest along the path'], ['last', 'Last', 'Closest to the gate'], ['strong', 'Strong', 'Most health'], ['close', 'Close', 'Nearest to the tower']];
const TOWER_RULES = { tier2Cost: 1.2, tier3Cost: 2, sellRefund: 0.7 };

function towerStats(def, tier, branch) {
  const s = { ...def.stats };
  if (branch) for (let i = 0; i < tier - 1; i++) Object.assign(s, def.branches[branch].tiers[i].stats);
  return s;
}
function upgradeCost(def, nextTier) {
  return Math.round((def.cost * (nextTier === 2 ? TOWER_RULES.tier2Cost : TOWER_RULES.tier3Cost)) / 5) * 5;
}
const noBuff = () => ({ damage: 0, rate: 0, range: 0, trueSight: false, from: 0 });
const tRange = (t) => t.s.range * (1 + t.buff.range);
const tDmg = (t) => 1 + t.buff.damage;
const tRate = (t) => (t.s.fireRate || 1) * (1 + t.buff.rate);
const tInterval = (t) => t.s.interval / (1 + t.buff.rate);

/* Rune Shrines: each tower takes the strongest boost on offer (they don't stack) */
function updateBuffs() {
  for (const t of state.towers) {
    const b = t.buff;
    b.damage = b.rate = b.range = 0; b.trueSight = false; b.from = 0;
  }
  for (const sh of state.towers) {
    if (sh.def.attack !== 'support') continue;
    const r = sh.s.range, s = sh.s;
    for (const t of state.towers) {
      if (t === sh || t.def.attack === 'support') continue;
      const dx = t.pos.x - sh.pos.x, dz = t.pos.z - sh.pos.z;
      if (dx * dx + dz * dz > r * r + 0.01) continue;
      const b = t.buff;
      b.damage = Math.max(b.damage, s.buffDamage || 0);
      b.rate = Math.max(b.rate, s.buffRate || 0);
      b.range = Math.max(b.range, s.buffRange || 0);
      b.trueSight = b.trueSight || !!s.trueSight;
      b.from++;
    }
  }
}

/* ---------- Enemy status effects ----------
   slow, vuln (takes more damage), shred (armor removed), eVuln (more energy damage),
   burn and bleed (damage over time). A stronger effect replaces a weaker one;
   an equal one refreshes the timer. */
function addEffect(e, kind, amt, time) {
  const A = kind + 'Amt', T = kind + 'T';
  if (amt > e[A] + 1e-6 || e[T] <= 0) { e[A] = amt; e[T] = time; }
  else if (amt >= e[A] - 1e-6) e[T] = Math.max(e[T], time);
}
function hold(e, kind, time) {
  if (!e.alive || (e.def.boss && kind !== 'stun')) time *= 0.5;
  if (time > e.holdT) { e.holdT = time; e.holdKind = kind; }
}
const canHit = (t, e) => e.alive && (t.s.air || !e.def.flying);
const flatDist2 = (a, b) => { const dx = a.x - b.x, dz = a.z - b.z; return dx * dx + dz * dz; };
const hitPoint = (e, out) => out.set(e.pos.x, e.pos.y + e.def.hitHeight, e.pos.z);
function enemySpeed(e) {
  if (e.holdT > 0) return 0;
  return e.def.speed * (1 - (e.slowT > 0 ? e.slowAmt : 0));
}
function predictPos(e, time, out) {
  samplePath(map, Math.min(map.total, e.dist + enemySpeed(e) * time), out);
  return out;
}

/* ---------- Damage ---------- */
/* o.cont: continuous damage (beams, burns, auras) — skips flat armor and the 1-damage floor */
function damageEnemy(e, amount, type, src, o = {}) {
  if (!e.alive || amount <= 0) return 0;
  if (!o.cont && e.def.dodge && !(src && src.buff && src.buff.trueSight) && Math.random() < e.def.dodge) {
    Floaters.add('MISS', tmpV.copy(e.pos).setY(0.9), '');
    return 0;
  }
  let mult = e.def.resist && e.def.resist[type] != null ? e.def.resist[type] : 1;
  if (e.vulnT > 0) mult *= 1 + e.vulnAmt;
  if (type === 'energy' && e.eVulnT > 0) mult *= 1 + e.eVulnAmt;
  if (o.boss && e.def.boss) mult *= 1 + o.boss;
  let dmg = amount * mult;
  if (e.shield > 0) {
    const k = 1 + (o.shieldBonus || 0);
    const soak = Math.min(e.shield, dmg * k);
    e.shield -= soak;
    dmg -= soak / k;
  }
  if (!o.cont && dmg > 0) {
    const armor = Math.max(0, (e.def.armor || 0) - (e.shredT > 0 ? e.shredAmt : 0)) * (1 - (o.ignoreArmor || 0));
    dmg = Math.max(1, dmg - armor);
  }
  e.hp -= dmg;
  if (o.cont) e.flash = Math.max(e.flash, 0.3); else e.flash = 1;
  if (src) src.dealt += dmg;
  Events.emit('enemyHit', { enemy: e, damage: dmg, type });
  if (e.hp <= 0) killEnemy(e, src);
  return dmg;
}

/* Area damage on the ground (and in the air when allowed) */
function splashAt(at, radius, damage, type, src, o = {}) {
  const r2 = (radius + 0.18) * (radius + 0.18);
  let hits = 0;
  for (const e of state.enemies) {
    if (!e.alive || (o.groundOnly && e.def.flying)) continue;
    if (flatDist2(e.pos, at) > r2) continue;
    hits++;
    if (o.onHit) o.onHit(e);
    damageEnemy(e, damage, type, src, o);
  }
  return hits;
}

function killEnemy(e, src) {
  e.alive = false;
  e.dissolve = true;
  state.coins += e.def.reward;
  state.stats.kills++;
  state.stats.earned += e.def.reward;
  if (src) src.kills++;
  const at = tmpV.copy(e.pos).setY(0.35);
  Particles.burst(at, { count: 10, color: e.def.color, speed: 1.8, up: 1.6, lifeTime: 0.5 });
  Particles.burst(at, { count: 8, color: STYLE.palette.holo, speed: 0.6, up: 2.4, lifeTime: 0.8, gravity: -0.5 });
  Particles.burst(at, { count: 6, color: 0xffcf5a, speed: 1, up: 2.6, lifeTime: 0.7, gravity: 4 });
  Floaters.add('+' + e.def.reward, at.clone().setY(0.8), 'gold');
  bumpPill('coins-pill');
  // Phoenix: the kill explodes (queued, so chain reactions resolve one step at a time)
  if (src && src.s.explode && src.def.attack === 'shot') state.blasts.push({ pos: e.pos.clone(), radius: 1.0, damage: src.s.explode * tDmg(src), type: src.s.damageType, src, color: 0xff6aa8, air: src.s.air });
  // Barbs: bleed jumps to enemies close by
  if (e.bleedT > 0 && e.bleedSpread > 0) {
    const r2 = e.bleedSpread * e.bleedSpread;
    for (const o of state.enemies) {
      if (o === e || !o.alive || o.def.flying || flatDist2(o.pos, e.pos) > r2) continue;
      addEffect(o, 'bleed', e.bleedAmt, e.bleedMax);
      o.bleedSrc = e.bleedSrc; o.bleedSpread = e.bleedSpread; o.bleedMax = e.bleedMax;
      Fx.seg(tmpV.copy(e.pos).setY(0.3), o.pos.clone().setY(0.3), 0xff5f74, 0.04, 0.25, 0.8);
    }
  }
  Events.emit('enemyKilled', { enemy: e });
}

function leak(e) {
  e.alive = false;
  state.lives = Math.max(0, state.lives - e.def.livesCost);
  state.stats.leaked++;
  crystal.hurt = 1;
  if (Save.data.settings.shake) camShake = Math.min(1, camShake + 0.55);
  const at = crystal.group.position.clone().setY(0.8);
  Particles.burst(at, { count: 20, color: 0xff5a6a, speed: 2.4, up: 2, lifeTime: 0.6 });
  Floaters.add('-' + e.def.livesCost, at.clone().setY(1.3), 'red');
  const pill = document.getElementById('lives-pill');
  pill.classList.remove('hurt'); void pill.offsetWidth; pill.classList.add('hurt');
  Events.emit('lifeLost', { enemy: e, lives: state.lives });
}

/* ---------- Towers ---------- */
function canBuildAt(c, r, key) {
  const def = CONTENT.towers[key];
  if (!map.inside(c, r)) return { ok: false, why: 'Off the board' };
  if (map.isPath(c, r)) return { ok: false, why: "Can't build on the path" };
  if (towerAt(c, r)) return { ok: false, why: 'Tile already taken' };
  if (state.coins < def.cost) return { ok: false, why: `Need ${def.cost - state.coins} more coins` };
  return { ok: true };
}
function towerAt(c, r) { return state.towers.find((t) => t.c === c && t.r === r) || null; }

/* Builds a tower's model for its tier and branch, ready to scan in */
function makeTowerMesh(t) {
  const m = MODELS.towers[t.def.model](t.def, t.tier, t.branch);
  addTierDecor(m, t.def, t.tier, t.branch);
  m.position.copy(t.pos);
  ownMaterials(m);
  t.clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), t.pos.y);
  m.traverse((o) => { if (o.material) o.material.clippingPlanes = [t.clip]; });
  m.userData.towerId = t.id;
  scene.add(m);
  if (t.scanRing) { scene.remove(t.scanRing); t.scanRing.material.dispose(); }
  t.scanRing = makeScanRing(t.tier >= 2 ? t.def.branches[t.branch].color : t.def.color);
  t.scanRing.scale.setScalar((m.userData.radius || 0.45) * m.scale.x);
  t.popT = 0;
  return m;
}

function buildTower(c, r, key) {
  const def = CONTENT.towers[key];
  const pos = map.toWorld(c, r, TILE_H);
  const t = {
    id: nextId++, key, def, c, r, pos, tier: 1, branch: null, s: towerStats(def, 1, null), buff: noBuff(),
    mesh: null, clip: null, scanRing: null, cooldown: 0.45, targetId: 0, kills: 0, dealt: 0, spent: def.cost,
    yaw: 0, recoil: 0, popT: 0, targeting: 'first', shotCount: 0, ramp: 0, beamTargets: [], drones: [],
    active: false, rootCd: 2,
  };
  t.mesh = makeTowerMesh(t);
  state.towers.push(t);
  state.coins -= def.cost;
  syncDrones(t);
  Particles.burst(tmpV.copy(pos).setY(TILE_H + 0.05), { count: 16, color: def.color, speed: 1.8, up: 0.5, lifeTime: 0.45, gravity: 2 });
  Particles.burst(tmpV.copy(pos).setY(0.5), { count: 10, color: STYLE.palette.rune, speed: 0.6, up: 2.2, lifeTime: 0.8, gravity: 0 });
  Events.emit('towerBuilt', { tower: t });
  updateHud();
  return t;
}

function upgradeTower(t, branch) {
  if (!state.towers.includes(t) || t.tier >= 3) return false;
  const next = t.tier + 1;
  const br = next === 2 ? branch : t.branch;
  if (!br || !t.def.branches[br]) return false;
  const cost = upgradeCost(t.def, next);
  if (state.coins < cost) { toast(`Need ${cost - state.coins} more coins`, 'warn'); return false; }
  state.coins -= cost;
  t.spent += cost;
  t.tier = next;
  t.branch = br;
  t.s = towerStats(t.def, t.tier, t.branch);
  t.anchors = null;
  // Swap in the upgraded model and print it in again
  const old = t.mesh;
  scene.remove(old);
  old.traverse((o) => { if (o.material) o.material.dispose(); });
  t.mesh = makeTowerMesh(t);
  t.mesh.userData.head && (t.mesh.userData.head.rotation.y = t.yaw);
  syncDrones(t);
  const bc = t.def.branches[br].color;
  const at = t.pos.clone().setY(0.6);
  Particles.burst(at, { count: 22, color: bc, speed: 2, up: 2.2, lifeTime: 0.7, gravity: 1 });
  Particles.burst(at, { count: 12, color: 0xffffff, speed: 0.8, up: 3, lifeTime: 0.6, gravity: 0 });
  Fx.ring(t.pos, 0.2, 1.3, bc, 0.5, { thick: true });
  Fx.flash(at, bc, 1.6, 0.35);
  Floaters.add(`TIER ${t.tier}`, at.clone().setY(1.4), 'up');
  Events.emit('towerUpgraded', { tower: t });
  updateHud();
  renderInfo(true);
  return true;
}

function removeTowerExtras(t) {
  for (const d of t.drones) scene.remove(d.mesh);
  t.drones = [];
  if (t.beamFx) { t.beamFx.forEach((b) => { scene.remove(b.core, b.glow); b.core.material.dispose(); b.glow.material.dispose(); }); t.beamFx = null; }
  if (t.buffRing) { scene.remove(t.buffRing); t.buffRing.material.dispose(); t.buffRing = null; }
  if (t.scanRing) { scene.remove(t.scanRing); t.scanRing = null; }
}

function sellTower(t) {
  const refund = Math.floor(t.spent * TOWER_RULES.sellRefund);
  state.coins += refund;
  removeTowerExtras(t);
  const ring = makeScanRing(t.def.color);
  ring.scale.setScalar((t.mesh.userData.radius || 0.45) * t.mesh.scale.x);
  const top = t.pos.y + (t.mesh.userData.height || 1) * t.mesh.scale.y + 0.05;
  t.clip.constant = top;
  t.mesh.traverse((o) => { if (o.material && o.material.emissive) { o.material.emissive.setHex(t.def.color); o.material.emissiveIntensity = Math.max(o.material.emissiveIntensity, 0.5); } });
  fx.vanishing.push({ mesh: t.mesh, clip: t.clip, ring, top, base: t.pos.y, t: 0, dur: 0.42 });
  state.towers = state.towers.filter((x) => x !== t);
  const at = t.pos.clone().setY(0.5);
  Particles.burst(at, { count: 14, color: 0xffcf5a, speed: 1.6, up: 2, lifeTime: 0.6 });
  Particles.burst(at, { count: 10, color: t.def.color, speed: 0.5, up: 2.4, lifeTime: 0.7, gravity: 0 });
  Floaters.add('+' + refund, at.clone().setY(1.1), 'gold');
  bumpPill('coins-pill');
  Events.emit('towerSold', { tower: t, refund });
  deselect();
  updateHud();
}

function setTargeting(t, mode) {
  t.targeting = mode;
  t.ramp = t.s.keepCharge ? t.ramp : 0;
  renderInfo(true);
}

/* Up to n enemies in range, best first by the tower's targeting choice */
const candidates = [];
function pickTargets(t, n = 1, range = tRange(t), minRange = 0) {
  candidates.length = 0;
  const r2 = range * range, m2 = minRange * minRange;
  for (const e of state.enemies) {
    if (!canHit(t, e)) continue;
    const d2 = flatDist2(e.pos, t.pos);
    if (d2 > r2 || d2 < m2) continue;
    e._d2 = d2;
    candidates.push(e);
  }
  if (!candidates.length) return candidates;
  const mode = t.targeting;
  const score = mode === 'last' ? (e) => -e.dist : mode === 'strong' ? (e) => e.hp * 1000 + e.dist : mode === 'close' ? (e) => -e._d2 : (e) => e.dist;
  if (n === 1) {
    let best = candidates[0], bs = score(best);
    for (let i = 1; i < candidates.length; i++) { const s = score(candidates[i]); if (s > bs) { bs = s; best = candidates[i]; } }
    candidates.length = 1; candidates[0] = best;
    return candidates;
  }
  candidates.sort((a, b) => score(b) - score(a));
  if (candidates.length > n) candidates.length = n;
  return candidates;
}
function anyInRange(t, range = tRange(t)) {
  const r2 = range * range;
  for (const e of state.enemies) if (canHit(t, e) && flatDist2(e.pos, t.pos) <= r2) return true;
  return false;
}

const muzzleV = new THREE.Vector3();
function muzzleOf(t, out = muzzleV) {
  const u = t.mesh.userData;
  if (u.muzzle) { t.mesh.updateMatrixWorld(true); return u.muzzle.getWorldPosition(out); }
  return out.set(t.pos.x, t.pos.y + (u.muzzleY || 0.8) * t.mesh.scale.y, t.pos.z);
}

/* ---------- Projectiles (meshes are pooled by look) ---------- */
const projectilePools = { arrow: [], orb: [] };
const arrowGeo = new THREE.CylinderGeometry(0.018, 0.018, 0.36, 5).rotateX(Math.PI / 2);
const tipGeo = new THREE.ConeGeometry(0.045, 0.11, 6).rotateX(Math.PI / 2).translate(0, 0, 0.22);
const orbGeo = new THREE.SphereGeometry(0.07, 10, 8);
function getProjectileMesh(look, color, size = 1) {
  let m = projectilePools[look].pop();
  if (!m) {
    m = new THREE.Group();
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    let tipMat = null;
    if (look === 'arrow') {
      tipMat = new THREE.MeshBasicMaterial({ color, toneMapped: false });
      glow.scale.setScalar(0.42); glow.position.z = 0.18;
      m.add(new THREE.Mesh(arrowGeo, coreMat), new THREE.Mesh(tipGeo, tipMat), glow);
    } else {
      glow.scale.setScalar(0.55);
      m.add(new THREE.Mesh(orbGeo, coreMat), glow);
    }
    m.userData = { look, tipMat, coreMat, glow };
  }
  const u = m.userData;
  if (u.tipMat) u.tipMat.color.set(color);
  u.glow.material.color.set(color);
  u.coreMat.color.set(look === 'orb' ? new THREE.Color(color).lerp(new THREE.Color(0xffffff), 0.6) : 0xffffff);
  m.scale.setScalar(size);
  m.visible = true;
  scene.add(m);
  return m;
}
function releaseProjectileMesh(m) { scene.remove(m); projectilePools[m.userData.look].push(m); }

function addProjectile(p) {
  p.prev = p.pos.clone();
  p.age = 0;
  p.mesh.position.copy(p.pos);
  if (p.aim) p.mesh.lookAt(p.aim);
  state.projectiles.push(p);
  return p;
}

/* Homing shot: arrows, fireballs and drone missiles */
function fireShot(t, target, from) {
  const s = t.s;
  t.shotCount++;
  const crit = s.critEvery && t.shotCount % s.critEvery === 0;
  const kind = t.def.projectile;
  const look = kind === 'arrow' ? 'arrow' : 'orb';
  const color = crit ? 0xffcf5a : kind === 'fireball' && t.branch === 'b' ? 0xff6aa8 : t.def.color;
  addProjectile({
    kind, tower: t, target, color, crit,
    damage: s.damage * tDmg(t) * (crit ? s.critMult : 1), type: s.damageType, speed: s.speed,
    pos: (from || muzzleOf(t)).clone(), aim: hitPoint(target, new THREE.Vector3()),
    mesh: getProjectileMesh(look, color, kind === 'fireball' ? 1.25 : crit ? 1.35 : 1),
  });
}

/* Ballista bolt: flies straight, hitting every enemy on its line up to `pierce` */
function fireBolt(t, target) {
  const s = t.s;
  const from = muzzleOf(t).clone();
  const lead = predictPos(target, from.distanceTo(target.pos) / s.speed, new THREE.Vector3());
  lead.y = target.pos.y + target.def.hitHeight;
  const dir = lead.sub(from).normalize();
  const aim = from.clone().addScaledVector(dir, 10);
  addProjectile({
    kind: 'bolt', tower: t, color: t.def.color, damage: s.damage * tDmg(t), type: s.damageType, speed: s.speed,
    pos: from, dir, aim, travel: 0, maxTravel: tRange(t) + 1.2, hit: new Set(), pierceLeft: s.pierce,
    mesh: getProjectileMesh('arrow', t.branch === 'a' ? 0xff9a3a : t.def.color, 1.9),
  });
}

/* Mortar shell: lobbed at where the target will be when it lands */
function fireShell(t, target, o = {}) {
  const s = t.s;
  const from = o.from ? o.from.clone() : muzzleOf(t).clone();
  const flight = o.flight || 1.05 + Math.sqrt(flatDist2(from, target ? target.pos : o.to)) * 0.08;
  const to = o.to ? o.to.clone() : predictPos(target, flight, new THREE.Vector3());
  to.y = PATH_H;
  addProjectile({
    kind: 'shell', tower: t, color: o.color || t.def.color, from, to, flight, arc: o.arc || 1.4 + Math.sqrt(flatDist2(from, to)) * 0.18,
    damage: (o.damage || s.damage) * tDmg(t), splash: o.splash || s.splash, type: s.damageType, bomblet: !!o.bomblet,
    pos: from.clone(), aim: to.clone(), mesh: getProjectileMesh('orb', o.color || t.def.color, o.bomblet ? 0.6 : 1.5),
  });
}

function shellLanded(p) {
  const t = p.tower, s = t.s;
  const hits = splashAt(p.to, p.splash, p.damage, p.type, t, {
    groundOnly: true,
    onHit: s.shred && !p.bomblet ? (e) => addEffect(e, 'shred', s.shred, s.shredTime || 4) : null,
  });
  Fx.ring(p.to, 0.2, p.splash, p.color, p.bomblet ? 0.3 : 0.45, { thick: true });
  Fx.flash(tmpV.copy(p.to).setY(0.35), p.color, p.bomblet ? 0.9 : 2.2, p.bomblet ? 0.2 : 0.32);
  Fx.disc(p.to, p.splash * 0.9, p.color, p.bomblet ? 0.25 : 0.5, 0.45);
  Particles.burst(tmpV.copy(p.to).setY(0.25), { count: p.bomblet ? 6 : 22, color: p.color, speed: p.bomblet ? 1.5 : 3.2, up: 2.2, lifeTime: 0.55, gravity: 5 });
  if (!p.bomblet) {
    Particles.burst(tmpV.copy(p.to).setY(0.3), { count: 10, color: 0xffffff, speed: 1.2, up: 1.5, lifeTime: 0.3, gravity: 2 });
    if (Save.data.settings.shake && hits > 0) camShake = Math.min(1, camShake + 0.12);
    if (s.bomblets) {
      for (let i = 0; i < s.bomblets; i++) {
        const a = (i / s.bomblets) * Math.PI * 2 + Math.random() * 0.6, r = 0.55 + Math.random() * 0.75;
        fireShell(t, null, { from: tmpV.copy(p.to).setY(0.3), to: new THREE.Vector3(p.to.x + Math.cos(a) * r, 0, p.to.z + Math.sin(a) * r), flight: 0.32 + Math.random() * 0.18, arc: 0.55, damage: s.bombletDamage, splash: 0.6, bomblet: true, color: 0xff7ad9 });
      }
    }
  }
  Events.emit('explosion', { at: p.to, big: !p.bomblet });
}

/* Impact of a homing shot */
function shotLanded(p) {
  const t = p.tower, s = t.s;
  if (p.kind === 'fireball') {
    splashAt(p.pos, s.splash, p.damage, p.type, t, { groundOnly: !s.air, onHit: (e) => { if (!e.def.flying || s.air) { addEffect(e, 'burn', s.burnDps * tDmg(t), s.burnTime); e.burnSrc = t; } } });
    Fx.ring(p.pos, 0.1, s.splash, p.color, 0.35, { thick: true });
    Fx.flash(p.pos, p.color, 1.5, 0.25);
    Particles.burst(p.pos, { count: 14, color: p.color, speed: 2.2, up: 1.8, lifeTime: 0.5, gravity: 3 });
    if (s.firePatch) state.zones.push({ pos: new THREE.Vector3(p.pos.x, 0, p.pos.z), radius: s.splash * 0.8, time: s.firePatch, tower: t, mesh: makeZoneMesh(s.splash * 0.8, 0xff7a2e) });
  } else if (p.kind === 'missile') {
    splashAt(p.pos, s.splash, p.damage, p.type, t, { boss: s.bossBonus });
    Fx.flash(p.pos, p.color, 1.1, 0.22);
    Fx.ring(p.pos, 0.1, s.splash, p.color, 0.3);
    Particles.burst(p.pos, { count: 10, color: p.color, speed: 2.2, up: 1.4, lifeTime: 0.4, gravity: 4 });
  } else {
    if (p.target.alive) {
      damageEnemy(p.target, p.damage, p.type, t, { boss: s.bossBonus });
      if (p.crit) { Floaters.add(Math.round(p.damage) + '!', tmpV.copy(p.pos).setY(p.pos.y + 0.4), 'gold'); Fx.flash(p.pos, 0xffcf5a, 1.2, 0.25); }
    }
    Particles.burst(p.pos, { count: 8, color: p.color, speed: 2.8, up: 1.1, lifeTime: 0.26, gravity: 6 });
    Particles.burst(p.pos, { count: 3, color: 0xffffff, speed: 0.6, up: 0.4, lifeTime: 0.14, gravity: 0 });
  }
}

/* Burning ground left by Inferno fireballs */

/* ---------- Chain lightning ---------- */
function fireChain(t, first) {
  const s = t.s;
  const from = muzzleOf(t).clone();
  let cur = first, prevPt = from, dmg = s.damage * tDmg(t);
  const hit = new Set();
  const jump2 = s.jump * s.jump;
  for (let i = 0; i < s.chains && cur; i++) {
    hit.add(cur);
    const pt = hitPoint(cur, new THREE.Vector3());
    Fx.lightning(prevPt, pt, t.def.color, 0.16, i === 0 ? 0.16 : 0.12);
    Fx.flash(pt, t.def.color, 0.8, 0.18);
    Particles.burst(pt, { count: 5, color: 0xdff4ff, speed: 2, up: 1, lifeTime: 0.2, gravity: 2 });
    const target = cur;
    damageEnemy(target, dmg, s.damageType, t, { shieldBonus: s.shieldBonus });
    if (s.stun && target.alive) hold(target, 'stun', s.stun);
    prevPt = pt;
    dmg *= 1 - s.falloff;
    // Next: nearest enemy to this one that hasn't been hit
    let next = null, nd = Infinity;
    for (const e of state.enemies) {
      if (!canHit(t, e) || hit.has(e)) continue;
      const d2 = flatDist2(e.pos, target.pos);
      if (d2 <= jump2 && d2 < nd) { nd = d2; next = e; }
    }
    cur = next;
  }
  Fx.flash(from, t.def.color, 1.3, 0.2);
}

/* ---------- Pulses (Frost Obelisk, Ion Pulse) ---------- */
function firePulse(t) {
  const s = t.s, r = tRange(t), r2 = r * r;
  const isFrost = t.key === 'frostObelisk';
  const color = t.tier >= 2 ? t.def.branches[t.branch].color : t.def.color;
  for (const e of state.enemies) {
    if (!canHit(t, e) || flatDist2(e.pos, t.pos) > r2) continue;
    if (isFrost) {
      addEffect(e, 'slow', s.slow, s.slowTime);
      if (s.vuln) addEffect(e, 'vuln', s.vuln, s.slowTime);
      if (s.shred) addEffect(e, 'shred', s.shred, s.slowTime);
      if (s.freezeAfter) {
        e.chill += tInterval(t); e.chillT = tInterval(t) + 0.6;

      }
      Particles.burst(tmpV.copy(e.pos).setY(0.35), { count: 3, color: 0xbff4ff, speed: 0.8, up: 0.8, lifeTime: 0.4, gravity: 1 });
    } else {
      addEffect(e, 'shred', s.shred, s.shredTime);
      if (s.shieldStrip && e.maxShield > 0) e.shield = Math.max(0, e.shield - e.maxShield * s.shieldStrip);
      if (s.energyVuln) addEffect(e, 'eVuln', s.energyVuln, s.shredTime);
      if (s.interrupt && e.def.boss && (e.interruptCd || 0) <= 0) { e.interrupted = true; e.interruptCd = s.interrupt; Floaters.add('INTERRUPTED', tmpV.copy(e.pos).setY(1.2), 'up'); }
      Fx.seg(muzzleOf(t).clone(), hitPoint(e, new THREE.Vector3()), color, 0.03, 0.12, 0.7);
    }
    damageEnemy(e, s.damage * tDmg(t), s.damageType, t);
  }
  Fx.ring(t.pos, 0.3, r, color, isFrost ? 0.6 : 0.45, { thick: !isFrost, opacity: isFrost ? 0.8 : 0.9 });
  if (isFrost) Fx.ring(t.pos, 0.2, r * 0.7, 0xffffff, 0.45, { opacity: 0.5 });
  Fx.flash(muzzleOf(t).clone(), color, isFrost ? 1.4 : 1.1, 0.25);
  t.recoil = 1;
}

/* ---------- Gravity Well ---------- */
/* Stretches of path inside the well, with the point closest to its centre.
   A pull moves enemies along the path towards that point. */
function pathAnchors(t) {
  const r = tRange(t);
  if (t.anchors && t.anchorsR === r) return t.anchors;
  const runs = [];
  let cur = null;
  const p = new THREE.Vector3();
  for (let d = 0; d <= map.total; d += 0.1) {
    samplePath(map, d, p);
    const dd = Math.sqrt(flatDist2(p, t.pos));
    if (dd <= r + 0.3) {
      if (!cur) { cur = { a: d, b: d, best: d, bestD: dd }; runs.push(cur); }
      cur.b = d;
      if (dd < cur.bestD) { cur.bestD = dd; cur.best = d; }
    } else cur = null;
  }
  t.anchors = runs; t.anchorsR = r;
  return runs;
}
function fireGravity(t) {
  const s = t.s, r = tRange(t), r2 = r * r;
  const runs = pathAnchors(t);
  const color = t.tier >= 2 ? t.def.branches[t.branch].color : t.def.color;
  const core = muzzleOf(t).clone();
  for (const e of state.enemies) {
    if (!canHit(t, e) || flatDist2(e.pos, t.pos) > r2) continue;
    const run = runs.find((ru) => e.dist >= ru.a - 0.2 && e.dist <= ru.b + 0.2);
    if (run) e.shove += Math.max(-s.pull, Math.min(s.pull, run.best - e.dist));
    damageEnemy(e, s.damage * tDmg(t), s.damageType, t);
    if (s.crush) damageEnemy(e, e.maxHp * s.crush * (e.def.boss ? 0.5 : 1) * tDmg(t), s.damageType, t, { cont: true });
    Fx.seg(hitPoint(e, new THREE.Vector3()), core, color, 0.035, 0.3, 0.6);
    Particles.burst(tmpV.copy(e.pos).setY(0.3), { count: 4, color, speed: 0.6, up: 0.6, lifeTime: 0.4, gravity: 0 });
  }
  Fx.ring(t.pos, r, 0.2, color, 0.55, { thick: true });
  Fx.ring(t.pos, r * 0.75, 0.1, 0xffffff, 0.45, { opacity: 0.5 });
  Fx.flash(core, color, 1.6, 0.3);
  t.recoil = 1;
}

/* ---------- Drones ---------- */
const droneGeo = {};
function makeDroneMesh(t) {

function syncDrones(t) {

  t.drones = [];
  for (let i = 0; i < want; i++) {

const goalV = new THREE.Vector3();
function updateDrones(t, dt) {
  const s = t.s, n = t.drones.length;
  if (!n) return;
  const targets = pickTargets(t, n);

  const list = targets.slice();
  t.drones.forEach((d, i) => {

    const dist = to.length(), maxStep = 6 * dt;
    if (dist > 0.0001) d.pos.addScaledVector(to, Math.min(1, maxStep / dist) * Math.min(1, dt * 8 + 0.15));

    d.cd -= dt;

}

/* ---------- One step of every tower ---------- */
function updateTower(t, dt) {
  const s = t.s;
  t.cooldown -= dt;
  switch (t.def.attack) {
    case 'shot': {
      const tg = pickTargets(t, s.shots || 1).slice();
      t.targetId = tg.length ? tg[0].id : 0;
      if (tg.length) {
        t.yaw = Math.atan2(tg[0].pos.x - t.pos.x, tg[0].pos.z - t.pos.z);
        if (t.cooldown <= 0) {
          for (const e of tg) fireShot(t, e);
          t.cooldown = 1 / tRate(t); t.recoil = 1;
          Events.emit('towerFire', { tower: t });
        }
      } else if (t.cooldown < 0) t.cooldown = 0;
      break;
    }
    case 'bolt': {
      const tg = pickTargets(t, 1)[0];
      t.targetId = tg ? tg.id : 0;
      if (tg) {
        t.yaw = Math.atan2(tg.pos.x - t.pos.x, tg.pos.z - t.pos.z);
        if (t.cooldown <= 0) { fireBolt(t, tg); t.cooldown = 1 / tRate(t); t.recoil = 1; Events.emit('towerFire', { tower: t }); }
      } else if (t.cooldown < 0) t.cooldown = 0;
      break;
    }
    case 'shell': {
      const tg = pickTargets(t, 1, tRange(t), s.minRange)[0];
      t.targetId = tg ? tg.id : 0;
      if (tg) {
        t.yaw = Math.atan2(tg.pos.x - t.pos.x, tg.pos.z - t.pos.z);
        if (t.cooldown <= 0) { fireShell(t, tg); t.cooldown = 1 / tRate(t); t.recoil = 1; Fx.flash(muzzleOf(t).clone(), t.def.color, 1.2, 0.2); Events.emit('towerFire', { tower: t }); }
      } else if (t.cooldown < 0) t.cooldown = 0;
      break;
    }
    case 'chain': {
      const tg = pickTargets(t, 1)[0];
      t.targetId = tg ? tg.id : 0;
      if (tg && t.cooldown <= 0) { fireChain(t, tg); t.cooldown = 1 / tRate(t); t.recoil = 1; Events.emit('towerFire', { tower: t }); }
      else if (!tg && t.cooldown < 0) t.cooldown = 0;
      break;
    }
    case 'beam': {
      const tg = pickTargets(t, s.beams).slice();
      const primary = tg.length ? tg[0].id : 0;
      if (primary !== t.targetId) t.ramp = primary && s.keepCharge ? t.ramp * s.keepCharge : 0;
      t.targetId = primary;
      t.beamTargets = tg;
      t.beamOn = tg.length > 0;
      if (tg.length) {
        t.yaw = Math.atan2(tg[0].pos.x - t.pos.x, tg[0].pos.z - t.pos.z);
        t.ramp = Math.min(1, t.ramp + dt / s.rampTime);
        const dps = (s.beamMin + (s.beamMax - s.beamMin) * t.ramp) * tDmg(t) * (tg.length > 1 || s.beams > 1 ? s.split : 1);
        for (const e of tg) damageEnemy(e, dps * dt, s.damageType, t, { cont: true });
      }
      break;
    }
    case 'pulse': {
      if (t.cooldown <= 0) {
        if (anyInRange(t)) { firePulse(t); t.cooldown = tInterval(t); Events.emit('towerFire', { tower: t }); }
        else t.cooldown = 0;
      }
      break;
    }
    case 'gravity': {
      const r2 = tRange(t) ** 2;
      let any = false;
      for (const e of state.enemies) {
        if (!canHit(t, e) || flatDist2(e.pos, t.pos) > r2) continue;
        any = true;
        addEffect(e, 'slow', s.insideSlow, 0.2);
        if (s.vuln) addEffect(e, 'vuln', s.vuln, 0.2);
      }
      t.active = any;
      if (t.cooldown <= 0) {
        if (any) { fireGravity(t); t.cooldown = tInterval(t); Events.emit('towerFire', { tower: t }); }
        else t.cooldown = 0;
      }
      break;
    }
    case 'aura': {
      const r2 = tRange(t) ** 2;
      const dps = s.dps * tDmg(t);
      let any = false, first = null;
      for (const e of state.enemies) {
        if (!canHit(t, e) || flatDist2(e.pos, t.pos) > r2) continue;
        any = true;
        if (!first || e.dist > first.dist) first = e;
        addEffect(e, 'slow', s.slow, 0.2);
        if (s.bleedDps) { addEffect(e, 'bleed', s.bleedDps * tDmg(t), s.bleedTime); e.bleedSrc = t; e.bleedSpread = s.bleedSpread || 0; e.bleedMax = s.bleedTime; }
        damageEnemy(e, dps * dt, s.damageType, t, { cont: true });
        if (Math.random() < dt * 4 * Q.fx) Particles.burst(tmpV.copy(e.pos).setY(0.15), { count: 2, color: s.bleedDps ? 0xff5f74 : 0x8dff6a, speed: 1, up: 1.4, lifeTime: 0.35, gravity: 5 });
      }
      t.active = any;
      if (s.rootEvery) {
        t.rootCd -= dt;
        if (t.rootCd <= 0 && first) {
          hold(first, 'root', s.rootTime);
          t.rootCd = s.rootEvery;
          t.recoil = 1;
          Fx.ring(first.pos, 0.6, 0.15, 0xc7ff5a, 0.5, { thick: true });
          Particles.burst(tmpV.copy(first.pos).setY(0.1), { count: 12, color: 0x8dff6a, speed: 0.8, up: 1.8, lifeTime: 0.6, gravity: 3 });
          Events.emit('towerFire', { tower: t });
        }
      }
      break;
    }
    case 'drones':
      updateDrones(t, dt);
      break;
    default:
      break;
  }
}

/* =====================================================================
   SIMULATION STEP (fixed timestep)
   ===================================================================== */
const EFFECTS = ['slow', 'vuln', 'shred', 'eVuln', 'burn', 'bleed'];
function step(dt) {
  state.time += dt;

  // Spawning
  if (state.phase === 'wave') {
    for (const s of state.spawners) {
      if (s.remaining <= 0) continue;
      s.timer -= dt;
      if (s.timer <= 0) { spawnEnemy(s.enemy, s.hp); s.remaining--; s.timer += s.interval; }
    }
  }

  // Queued kill explosions (Phoenix)
  if (state.blasts.length) {
    const list = state.blasts.splice(0);
    for (const b of list) {
      splashAt(b.pos, b.radius, b.damage, b.type, b.src, { groundOnly: !b.air });
      Fx.flash(tmpV.copy(b.pos).setY(0.4), b.color, 1.6, 0.28);
      Fx.ring(b.pos, 0.2, b.radius, b.color, 0.35, { thick: true });
      Particles.burst(tmpV.copy(b.pos).setY(0.3), { count: 12, color: b.color, speed: 2.4, up: 2, lifeTime: 0.45, gravity: 4 });
    }
  }

  // Enemies: status effects, then walk the path
  for (const e of state.enemies) {
    if (!e.alive) continue;
    e.prev.copy(e.pos);
    for (const k of EFFECTS) if (e[k + 'T'] > 0) e[k + 'T'] -= dt;
    if (e.burnT > 0) damageEnemy(e, e.burnAmt * dt, 'magic', e.burnSrc, { cont: true });
    if (e.bleedT > 0 && e.alive) damageEnemy(e, e.bleedAmt * dt, 'magic', e.bleedSrc, { cont: true });
    if (!e.alive) continue;
    if (e.chillT > 0) { e.chillT -= dt; if (e.chillT <= 0) e.chill = 0; }
    if (e.freezeCd > 0) e.freezeCd -= dt;
    if (e.interruptCd > 0) e.interruptCd -= dt;
    const spd = enemySpeed(e);
    if (e.holdT > 0) { e.holdT -= dt; if (e.holdT <= 0) e.holdKind = ''; }
    e.curSpeed = spd;
    let move = spd * dt;
    if (e.shove) { const k = Math.sign(e.shove) * Math.min(Math.abs(e.shove), 5 * dt); move += k; e.shove -= k; if (Math.abs(e.shove) < 1e-3) e.shove = 0; }
    e.dist = Math.max(0, e.dist + move);
    e.yaw = samplePath(map, e.dist, e.pos);
    if (e.dist >= map.total) leak(e);
  }

  // Burning ground
  for (let i = state.zones.length - 1; i >= 0; i--) {
    const z = state.zones[i];
    z.time -= dt;
    const r2 = z.radius * z.radius;
    const t = z.tower, s = t.s;
    for (const e of state.enemies) {
      if (!e.alive || e.def.flying || flatDist2(e.pos, z.pos) > r2) continue;
      addEffect(e, 'burn', s.burnDps * tDmg(t), Math.min(s.burnTime, 1));
      e.burnSrc = t;
    }
    if (z.time <= 0) { scene.remove(z.mesh); z.mesh.userData.disc.geometry.dispose(); z.mesh.userData.disc.material.dispose(); state.zones.splice(i, 1); }
  }

  // Towers
  updateBuffs();
  for (const t of state.towers) updateTower(t, dt);

  // Projectiles
  for (const p of state.projectiles) {
    p.prev.copy(p.pos);
    p.age += dt;
    if (p.kind === 'shell') {
      const k = Math.min(1, p.age / p.flight);
      p.pos.lerpVectors(p.from, p.to, k);
      p.pos.y += Math.sin(Math.PI * k) * p.arc + (1 - k) * 0.0;
      p.aim.copy(p.to);
      if (k >= 1) { p.done = true; shellLanded(p); }
      continue;
    }
    if (p.kind === 'bolt') {
      const move = p.speed * dt;
      const a = tmpV.copy(p.pos);
      p.pos.addScaledVector(p.dir, move);
      p.travel += move;
      // Hit everything the bolt passed this step
      const bx = p.pos.x - a.x, bz = p.pos.z - a.z, L2 = bx * bx + bz * bz;
      for (const e of state.enemies) {
        if (!canHit(p.tower, e) || p.hit.has(e)) continue;
        let k = L2 > 0 ? ((e.pos.x - a.x) * bx + (e.pos.z - a.z) * bz) / L2 : 0;
        k = Math.max(0, Math.min(1, k));
        const dx = a.x + bx * k - e.pos.x, dz = a.z + bz * k - e.pos.z;
        if (dx * dx + dz * dz > 0.36 * 0.36) continue;
        p.hit.add(e);
        const s = p.tower.s;
        damageEnemy(e, p.damage, p.type, p.tower, { ignoreArmor: s.ignoreArmor });
        if (s.knockback && e.alive) e.shove -= s.knockback * (e.def.boss ? 0.3 : 1);
        Particles.burst(hitPoint(e, new THREE.Vector3()), { count: 7, color: p.color, speed: 2.4, up: 1, lifeTime: 0.25, gravity: 5 });
        if (--p.pierceLeft <= 0) { p.done = true; break; }
      }
      if (p.travel >= p.maxTravel) p.done = true;
      continue;
    }
    // Homing shots
    if (p.target.alive) hitPoint(p.target, p.aim);
    const toAim = tmpV.subVectors(p.aim, p.pos);
    const d = toAim.length();
    const move = p.speed * dt;
    if (p.kind === 'fireball') p.pos.y += Math.sin(Math.min(1, p.age * 2.5) * Math.PI) * dt * 0.8;   // slight lob
    if (d <= move + 0.05) { p.pos.copy(p.aim); p.done = true; shotLanded(p); }
    else p.pos.addScaledVector(toAim, move / d);
    if (p.age > 4) p.done = true;
  }

  // Clean up
  state.enemies = state.enemies.filter((e) => {
    if (!e.alive) { if (e.dissolve) startDissolve(e); else removeEnemyMesh(e); return false; }
    return true;
  });
  state.projectiles = state.projectiles.filter((p) => {
    if (p.done) { releaseProjectileMesh(p.mesh); return false; }
    return true;
  });

  // Win / lose
  if (state.phase === 'wave') {
    if (state.lives <= 0) {
      state.phase = 'lost';
      state.endTimer = 0.9;
      Events.emit('defeat', {});
    } else {
      const spawningDone = state.spawners.every((s) => s.remaining <= 0);
      if (spawningDone && state.enemies.length === 0) {
        if (state.waveIndex >= map.def.waves.length) {
          state.phase = 'won';
          state.endTimer = 1.0;
          Events.emit('victory', {});
        } else {
          state.phase = 'ready';
          banner(`WAVE ${state.waveIndex} CLEARED`, 'Build up for the next one', 'clear');
          Events.emit('waveClear', { index: state.waveIndex });
        }
      }
    }
  }
}

/* =====================================================================
   INPUT — one pointer path for mouse and touch
   ===================================================================== */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -TILE_H);
let buildKey = null;            // tower type in build mode
let preview = null;             // { c, r } tile shown with ghost
let hoverTile = null;           // mouse hover tile
let selected = null;            // selected tower

function setNdc(e) {
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
}
function tileFromEvent(e) {
  setNdc(e);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(groundPlane, hit)) return null;
  const c = Math.floor(hit.x + map.cols / 2), r = Math.floor(hit.z + map.rows / 2);
  return { c, r, inside: map.inside(c, r) };
}
function pickTower(e) {
  setNdc(e);
  const hits = raycaster.intersectObjects(state.towers.map((t) => t.mesh), true);
  if (hits.length) {
    let o = hits[0].object;
    while (o && o.userData.towerId == null) o = o.parent;
    if (o) return state.towers.find((t) => t.id === o.userData.towerId) || null;
  }
  const tile = tileFromEvent(e);
  return tile && tile.inside ? towerAt(tile.c, tile.r) : null;
}

let down = null;
canvas.addEventListener('pointerdown', (e) => {
  down = { x: e.clientX, y: e.clientY, type: e.pointerType, button: e.button };
  canvas.focus({ preventScroll: true });
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  const tile = tileFromEvent(e);
  hoverTile = tile && tile.inside ? tile : null;
  let pointer = false;
  if (!buildKey && state.towers.length && !isUiBlocked()) pointer = !!pickTower(e);
  canvas.style.cursor = buildKey ? (hoverTile ? 'crosshair' : 'default') : pointer ? 'pointer' : 'default';
});
canvas.addEventListener('pointerleave', () => { hoverTile = null; });
canvas.addEventListener('pointerup', (e) => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  const wasRight = down.button === 2;
  down = null;
  if (moved > 14 || isUiBlocked()) return;
  if (wasRight) { cancelBuild(); deselect(); return; }
  handleTap(e);
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function isUiBlocked() { return state.phase === 'title' || state.phase === 'won' || state.phase === 'lost' || state.paused; }

function handleTap(e) {
  if (buildKey) {
    const tile = tileFromEvent(e);
    if (!tile || !tile.inside) { cancelBuild(); return; }
    const isTouch = e.pointerType !== 'mouse';
    if (isTouch && !(preview && preview.c === tile.c && preview.r === tile.r)) {
      preview = { c: tile.c, r: tile.r };   // first tap: preview only
      return;
    }
    tryBuild(tile.c, tile.r);
    return;
  }
  const t = pickTower(e);
  if (t) selectTower(t); else deselect();
}

function tryBuild(c, r) {
  const check = canBuildAt(c, r, buildKey);
  if (!check.ok) {
    toast(check.why, 'warn');
    highlightFlash = 1;
    return;
  }
  buildTower(c, r, buildKey);
  preview = null;
  if (state.coins < CONTENT.towers[buildKey].cost) cancelBuild();
}

function enterBuild(key) {
  if (isUiBlocked()) return;
  if (buildKey === key) { cancelBuild(); return; }
  deselect();
  buildKey = key;
  preview = null;
  const def = CONTENT.towers[key];
  if (state.coins < def.cost) toast(`Need ${def.cost - state.coins} more coins`, 'warn');
  else toast(`${def.name} · ${def.role}`, '', 1600);
  setGhost(key);
  renderCards();
}
function cancelBuild() {
  buildKey = null;
  preview = null;
  setGhost(null);
  renderCards();
}

function selectTower(t) {
  selected = t;
  renderInfo();
}
function deselect() {
  selected = null;
  renderInfo();
}

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePause(); return; }
  if (isUiBlocked()) return;
  if (k === 'escape') { cancelBuild(); deselect(); }
  else if (k === 'f') toggleSpeed();
  else if (k === 'enter') startWave();
  else if (k === 's' && selected) sellTower(selected);
  else if (k === 't' && selected && selected.def.targets) { const i = TARGETING.findIndex(([m]) => m === selected.targeting); setTargeting(selected, TARGETING[(i + 1) % TARGETING.length][0]); }
  else if (k === 'u' && selected && selected.tier === 2) upgradeTower(selected, selected.branch);
  else {
    for (const key of map.def.towers) if (CONTENT.towers[key].hotkey === k) enterBuild(key);
  }
});

   ===================================================================== */
const highlight = new THREE.Mesh(new THREE.PlaneGeometry(0.98, 0.98), STYLE.holo(0x5dffb0, 0.8, holoTileTex));
highlight.rotation.x = -Math.PI / 2;
highlight.visible = false;
highlight.renderOrder = 5;
scene.add(highlight);
let highlightFlash = 0;

function makeRangeIndicator() {
  const g = new THREE.Group();
  const ringMat = STYLE.holo(0x58e6ff, 0.9);
  const discMat = STYLE.holo(0x58e6ff, 0.75, rangeTex);
  const sweepMat = STYLE.holo(0x58e6ff, 0.8, sweepTex);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.96, 1, 72), ringMat);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(1, 72), discMat);
  const sweep = new THREE.Mesh(new THREE.CircleGeometry(1, 72), sweepMat);
  ring.rotation.x = disc.rotation.x = sweep.rotation.x = -Math.PI / 2;
  sweep.position.y = 0.002;
  ring.renderOrder = disc.renderOrder = sweep.renderOrder = 6;
  g.add(disc, sweep, ring);
  g.visible = false;
  g.userData = { ring, ringMat, discMat, sweep, sweepMat, radius: 0 };
  scene.add(g);
  return g;
}
const rangeIndicator = makeRangeIndicator();
function showRange(at, radius, color) {
  const u = rangeIndicator.userData;
  if (u.radius !== radius) {
    u.ring.geometry.dispose();
    u.ring.geometry = new THREE.RingGeometry(1 - 0.045 / radius, 1, 72);
    u.radius = radius;
  }
  rangeIndicator.scale.set(radius, 1, radius);
  rangeIndicator.position.set(at.x, TILE_H + 0.012, at.z);
  u.ringMat.color.set(color);
  u.discMat.color.set(color);
  u.sweepMat.color.set(color);
  rangeIndicator.visible = true;
}

let ghost = null;
const ghostCache = {};
function setGhost(key) {
  if (ghost) { scene.remove(ghost); ghost = null; }
  if (!key) return;
  if (!ghostCache[key]) {
    const def = CONTENT.towers[key];
    const g = MODELS.towers[def.model](def, 1, null);
    g.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = false;
        o.material = o.material.clone();
        o.material.transparent = true;
        o.material.opacity = 0.45;
        o.material.depthWrite = false;
        if (o.material.emissive) { o.material.emissive.setHex(def.color); o.material.emissiveIntensity = Math.max(0.35, o.material.emissiveIntensity); }
      }
    });
    ghostCache[key] = g;
  }
  ghost = ghostCache[key];
  ghost.visible = false;
  scene.add(ghost);
}

const placeHint = document.getElementById('place-hint');

function updateHelpers(dt, t) {
  highlightFlash = Math.max(0, highlightFlash - dt * 3);
  rangeIndicator.userData.sweep.rotation.z -= dt * 1.6;
  let showTile = null;
  if (buildKey) showTile = preview || hoverTile;
  if (showTile && !isUiBlocked()) {
    const p = map.toWorld(showTile.c, showTile.r);
    const check = canBuildAt(showTile.c, showTile.r, buildKey);
    const y = map.isPath(showTile.c, showTile.r) ? PATH_H : TILE_H;
    highlight.position.set(p.x, y + 0.01, p.z);
    highlight.material.color.set(check.ok ? 0x5dffb0 : 0xff4d5e);
    highlight.material.opacity = 0.7 + Math.sin(t * 6) * 0.18 + highlightFlash * 0.6;
    highlight.visible = true;
    const def = CONTENT.towers[buildKey];
    const occupied = towerAt(showTile.c, showTile.r);
    if (ghost) {
      ghost.visible = !occupied && !map.isPath(showTile.c, showTile.r);
      ghost.position.set(p.x, TILE_H, p.z);
      if (ghost.userData.head) ghost.userData.head.rotation.y = t * 0.8;
    }
    showRange(p, def.stats.range, check.ok ? (def.attack === 'support' ? 0xb07cff : 0x58e6ff) : 0xff5f74);
    // Touch: label telling the player to tap again
    if (preview) {
      const v = tmpV.set(p.x, TILE_H + 1.25, p.z).project(camera);
      placeHint.hidden = false;
      placeHint.className = check.ok ? '' : 'bad';
      placeHint.textContent = check.ok ? `Tap again to build · ${def.cost}` : check.why;
      placeHint.style.transform = `translate(${(v.x * 0.5 + 0.5) * innerWidth}px, ${(-v.y * 0.5 + 0.5) * innerHeight}px) translate(-50%, -100%)`;
    } else placeHint.hidden = true;
  } else {
    highlight.visible = false;
    if (ghost) ghost.visible = false;
    placeHint.hidden = true;
    if (selected) showRange(selected.pos, tRange(selected), selected.def.attack === 'support' ? 0xb07cff : selected.tier >= 2 ? selected.def.branches[selected.branch].color : 0x58e6ff);
    else rangeIndicator.visible = false;
  }
}

function updateHud(force) {
  const waves = map.def.waves.length;
  const h = { lives: state.lives, coins: state.coins, wave: `${state.waveIndex}/${waves}`, phase: state.phase, speed: state.speed, paused: state.paused };
  if (force || h.lives !== lastHud.lives) $('lives').textContent = h.lives;

  if (force || h.speed !== lastHud.speed) { $('speed-btn').textContent = h.speed + '×'; $('speed-btn').classList.toggle('on', h.speed > 1); }

/* =====================================================================
   CAMERA FIT — keep the whole board visible between the HUD bars
   ===================================================================== */
function fitCamera() {
  const W = innerWidth, H = innerHeight;
  resizeRender();
  camera.aspect = W / H;
  camera.clearViewOffset();
  const topPx = $('hud').getBoundingClientRect().bottom + 6;
  const bottomPx = H - $('bottom-bar').getBoundingClientRect().top + 6;
  const side = 8;
  const ax0 = -1 + (2 * side) / W, ax1 = 1 - (2 * side) / W;
  const ay0 = -1 + (2 * bottomPx) / H, ay1 = 1 - (2 * topPx) / H;
  const hx = map.cols / 2 + 0.45, hz = map.rows / 2 + 0.45;
  const pts = [];
  for (const x of [-hx, hx]) for (const z of [-hz, hz]) for (const y of [-0.05, 0.3]) pts.push(new THREE.Vector3(x, y, z));
  pts.push(map.points[0].clone().setY(1.0));                     // portal top
  pts.push(crystal.group.position.clone().setY(1.4));            // crystal top
  const v = new THREE.Vector3();
  const box = (d) => {
    camera.position.copy(camTarget).addScaledVector(camDir, d);
    camera.lookAt(camTarget);
    camera.updateMatrixWorld();
    camera.updateProjectionMatrix();
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const p of pts) {
      v.copy(p).project(camera);
      x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
    }
    return { x0, x1, y0, y1 };
  };
  let lo = 4, hi = 120;
  for (let i = 0; i < 28; i++) {
    const mid = (lo + hi) / 2;
    const b = box(mid);
    if (b.x1 - b.x0 <= ax1 - ax0 && b.y1 - b.y0 <= ay1 - ay0) hi = mid; else lo = mid;
  }
  const b = box(hi);
  const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  const tx = (ax0 + ax1) / 2, ty = (ay0 + ay1) / 2;
  camera.setViewOffset(W, H, ((cx - tx) / 2) * W, (-(cy - ty) / 2) * H, W, H);
  camera.far = hi * 3 + 20;
  camera.updateProjectionMatrix();
  scene.fog.near = hi * 1.1;
  scene.fog.far = hi * 2.6;
  camBase.copy(camera.position);
  $('rotate-hint').hidden = !(H > W && W < 700) || state.phase === 'title';
}
window.addEventListener('resize', fitCamera);
window.addEventListener('orientationchange', () => setTimeout(fitCamera, 200));

/* =====================================================================
   RENDER LOOP — fixed-step simulation, smooth interpolated drawing
   ===================================================================== */
const lerpAngle = (a, b, k) => a + ((((b - a) % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI) * k;
let acc = 0;
let last = performance.now();
let realTime = 0;
const fpsEl = $('fps');
const showFps = new URLSearchParams(location.search).has('fps');
fpsEl.hidden = !showFps;
let fpsFrames = 0, fpsTime = 0;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;               // tab was hidden or the frame hitched
  realTime += dt;

  const running = (state.phase === 'ready' || state.phase === 'wave' || state.phase === 'won' || state.phase === 'lost') && !state.paused;
  const vdt = running ? dt * state.speed : 0;   // visual time follows the game clock

  if (running) {
    acc += dt * state.speed;
    let steps = 0;
    while (acc >= SIM_DT && steps < 12) { step(SIM_DT); acc -= SIM_DT; steps++; }
    if (steps === 12) acc = 0;
  }
  const alpha = acc / SIM_DT;

  // End screens after a short beat
  if ((state.phase === 'won' || state.phase === 'lost') && state.endTimer > 0) {
    state.endTimer -= dt;
    if (state.endTimer <= 0) showEnd(state.phase === 'won');
  }

  drawWorld(dt, vdt, alpha);
  Particles.update(vdt);
  Floaters.update(vdt);
  updateHelpers(dt, realTime);
  updateHud();
  if (selected && (infoRefresh -= dt) <= 0) { infoRefresh = 0.4; const k = selected.kills; if (k !== selected._shownKills) { selected._shownKills = k; renderInfo(); } }

  // Camera shake
  camShake = Math.max(0, camShake - dt * 2.2);
  camera.position.copy(camBase);
  if (camShake > 0) {
    const s = camShake * camShake * 0.18;
    camera.position.x += (Math.random() - 0.5) * s;
    camera.position.y += (Math.random() - 0.5) * s;
  }

  renderFrame();

  if (showFps) {
    fpsFrames++; fpsTime += dt;
    if (fpsTime >= 0.5) { fpsEl.textContent = Math.round(fpsFrames / fpsTime) + ' fps'; fpsFrames = 0; fpsTime = 0; }
  }
}

function drawWorld(dt, vdt, alpha) {
  const t = realTime;
  // Enemies
  for (const e of state.enemies) {
    e.mesh.position.lerpVectors(e.prev, e.pos, alpha);
    e.mesh.rotation.y = lerpAngle(e.mesh.rotation.y, e.yaw, 1 - Math.exp(-14 * dt));
    const u = e.mesh.userData;
    const held = e.holdT > 0;
    e.anim += vdt * (e.curSpeed ?? e.def.speed) * 7;
    u.bob.position.y = Math.abs(Math.sin(e.anim)) * 0.06;
    u.bob.rotation.z = Math.sin(e.anim) * 0.08 + (e.holdKind === 'stun' ? Math.sin(t * 30) * 0.06 : 0);
    u.armL.rotation.x = Math.sin(e.anim) * 0.7;
    u.armR.rotation.x = -Math.sin(e.anim) * 0.7;
    e.spawnT = Math.min(1, e.spawnT + vdt * 4);
    e.mesh.scale.setScalar(0.4 + 0.6 * easeOutBack(e.spawnT));
    e.flash = Math.max(0, e.flash - vdt * 7);
    // Status tint on top of the hit flash
    let r = 0, g = 0, b = 0;
    if (e.holdKind === 'freeze') { r = 0.25; g = 0.7; b = 1; }
    else if (e.holdKind === 'stun') { const k = Math.sin(t * 20) > 0 ? 0.6 : 0.25; r = k; g = k; b = 0.15; }
    else if (e.holdKind === 'root') { r = 0.1; g = 0.45; b = 0.05; }
    else if (e.slowT > 0) { r = 0.05; g = 0.18; b = 0.45 * e.slowAmt * 2; }
    if (e.burnT > 0) { const k = 0.25 + Math.sin(t * 18 + e.id) * 0.12; r += k * 1.4; g += k * 0.5; }
    if (e.vulnT > 0) { r += 0.1; b += 0.15; }
    e.bodyMat.emissive.setRGB(Math.min(1.5, r + e.flash), Math.min(1.5, g + e.flash), Math.min(1.5, b + e.flash));
    // Ice shell and root vines
    if (e.holdKind === 'freeze' && !e.ice) {
      e.ice = new THREE.Mesh(geo('IcosahedronGeometry', 0.34, 0), new THREE.MeshStandardMaterial({ color: 0xc8f6ff, emissive: 0x3fc8ff, emissiveIntensity: 0.6, transparent: true, opacity: 0.55, roughness: 0.1, depthWrite: false }));
      e.ice.position.y = 0.32; e.ice.scale.set(1, 1.35, 1);
      e.mesh.add(e.ice);
    }
    if (e.ice) e.ice.visible = e.holdKind === 'freeze';
    if (e.holdKind === 'root' && !e.vines) {
      e.vines = new THREE.Mesh(geo('TorusGeometry', 0.2, 0.035, 5, 14), STYLE.glow(0x6fe06a, 1.2));
      e.vines.rotation.x = Math.PI / 2; e.vines.position.y = 0.08;
      e.mesh.add(e.vines);
    }
    if (e.vines) { e.vines.visible = e.holdKind === 'root'; e.vines.rotation.z += dt * 3; }
    if (vdt > 0) {
      const fxk = vdt * Q.fx;
      if (e.burnT > 0 && Math.random() < fxk * 10) Particles.burst(tmpV.copy(e.mesh.position).setY(0.3 + Math.random() * 0.3), { count: 1, color: Math.random() < 0.5 ? 0xff7a2e : 0xffcf5a, speed: 0.3, up: 1.4, lifeTime: 0.45, gravity: -1 });
      if (e.slowT > 0 && !held && Math.random() < fxk * 4) Particles.burst(tmpV.copy(e.mesh.position).setY(0.5), { count: 1, color: 0xbff4ff, speed: 0.3, up: 0.2, lifeTime: 0.5, gravity: 1.5 });
      if (e.bleedT > 0 && Math.random() < fxk * 6) Particles.burst(tmpV.copy(e.mesh.position).setY(0.3), { count: 1, color: 0xff3a4e, speed: 0.2, up: 0.2, lifeTime: 0.5, gravity: 6 });
      if (e.holdKind === 'stun' && Math.random() < fxk * 16) { const a = t * 9 + e.id; Particles.trail(tmpV.set(e.mesh.position.x + Math.cos(a) * 0.2, 0.75, e.mesh.position.z + Math.sin(a) * 0.2), 0xffe36a, 0.2); }
      if (e.shredT > 0 && Math.random() < fxk * 3) Particles.burst(tmpV.copy(e.mesh.position).setY(0.45), { count: 1, color: 0xff9a3a, speed: 1, up: 0.8, lifeTime: 0.25, gravity: 4 });
    }
    const hpK = Math.max(0, e.hp / e.maxHp);
    e.hb.group.visible = hpK < 1;
    if (hpK < 1) {
      e.hb.fill.scale.x = Math.max(0.001, hpK);
      e.hb.fillMat.color.setHSL(0.33 * hpK, 0.9, 0.55);
      e.hb.group.quaternion.copy(camera.quaternion).premultiply(tmpQ.copy(e.mesh.quaternion).invert());
    }
  }
  // Towers
  for (const tw of state.towers) {
    const u = tw.mesh.userData;
    // Hologram scan-in: the tower is "printed" from the base up
    if (tw.popT < 1) {
      tw.popT = Math.min(1, tw.popT + dt * 1.9);
      const k = 1 - Math.pow(1 - tw.popT, 2);
      const h = tw.pos.y + (u.height || 1) * tw.mesh.scale.y * k + 0.02;
      tw.clip.constant = tw.popT >= 1 ? 1e4 : h;
      if (tw.scanRing) {
        tw.scanRing.position.set(tw.pos.x, h, tw.pos.z);
        tw.scanRing.material.opacity = 0.9 * (1 - tw.popT * 0.6);
      }
      if (Math.random() < 0.5) Particles.trail(tmpV.set(tw.pos.x + (Math.random() - 0.5) * 0.7, h, tw.pos.z + (Math.random() - 0.5) * 0.7), tw.def.color, 0.3);
      if (tw.popT >= 1 && tw.scanRing) { scene.remove(tw.scanRing); tw.scanRing.material.dispose(); tw.scanRing = null; }
    }
    if (u.head) {
      if (u.aims && tw.targetId) u.head.rotation.y = lerpAngle(u.head.rotation.y, tw.yaw, 1 - Math.exp(-18 * dt));
      else u.head.rotation.y += vdt * 0.4;   // idle scan
    }
    tw.recoil = Math.max(0, tw.recoil - vdt * 6);
    if (u.recoil) {
      const off = -0.09 * tw.recoil * (u.recoilScale || 1);
      if (u.recoilAxis === 'y') u.recoil.position.y = off; else u.recoil.position.z = off;
    }
    const flick = Math.sin(t * 2 + tw.id) * 0.2;
    u.glow.emissiveIntensity = 1.5 + tw.recoil * 3 + flick + (selected === tw ? 0.8 : 0);
    if (u.runeRing) u.runeRing.rotation.z += dt * (0.5 + tw.recoil * 2);
    u.runeMat.opacity = 0.6 + Math.sin(t * 1.7 + tw.id) * 0.2;
    if (u.tierGlow) u.tierGlow.emissiveIntensity = 0.9 + Math.sin(t * 3 + tw.id) * 0.25 + (selected === tw ? 0.5 : 0);
    if (u.halo) { u.halo.rotation.y += dt * 1.1; u.halo.position.y = (u.height - 0.08) / tw.mesh.scale.y + Math.sin(t * 2 + tw.id) * 0.03; }
    if (u.anim) u.anim(tw, dt, t, vdt);
    // Rune Shrine boost: a violet rune ring under boosted towers
    if (tw.buff.from > 0) {
      if (!tw.buffRing) {
        tw.buffRing = new THREE.Mesh(geo('RingGeometry', 0.3, 0.52, 40), STYLE.holo(STYLE.palette.rune, 0.6, runeTex));
        tw.buffRing.rotation.x = -Math.PI / 2;
        tw.buffRing.renderOrder = 4;
        scene.add(tw.buffRing);
      }
      tw.buffRing.visible = true;
      tw.buffRing.position.set(tw.pos.x, TILE_H + 0.015, tw.pos.z);
      tw.buffRing.rotation.z -= dt * 0.7;
      tw.buffRing.material.opacity = 0.45 + Math.sin(t * 2.5 + tw.id) * 0.15;
    } else if (tw.buffRing) tw.buffRing.visible = false;
    // Laser beams
    if (tw.def.attack === 'beam') {
      const want = tw.beamOn ? tw.beamTargets.length : 0;
      tw.beamFx ||= [];
      while (tw.beamFx.length < want) {
        const core = Fx.makeSeg(0xffffff), glow = Fx.makeSeg(tw.def.color);
        scene.add(core, glow);
        tw.beamFx.push({ core, glow });
      }
      const from = want ? muzzleOf(tw).clone() : null;
      tw.beamFx.forEach((bm, i) => {
        const e = tw.beamTargets[i];
        const on = i < want && e && e.alive;
        bm.core.visible = bm.glow.visible = on;
        if (!on) return;
        const to = tmpV.copy(e.mesh.position).setY(e.mesh.position.y + e.def.hitHeight);
        const ramp = tw.ramp, wob = 1 + Math.sin(t * 50 + i) * 0.12;
        const w = (0.02 + ramp * 0.035) * wob * (i ? 0.75 : 1);
        Fx.place(bm.core, from, to, w);
        Fx.place(bm.glow, from, to, w * 3.2);
        bm.core.material.opacity = 0.95;
        bm.glow.material.opacity = 0.35 + ramp * 0.35;
        bm.glow.material.color.set(tw.branch === 'b' && i ? 0xc9a6ff : tw.def.color);
        if (vdt > 0 && Math.random() < vdt * (8 + ramp * 20) * Q.fx) Particles.burst(to, { count: 1, color: Math.random() < 0.5 ? tw.def.color : 0xffffff, speed: 1.8, up: 1, lifeTime: 0.25, gravity: 5 });
      });
    }
    // Drones fly between steps, so they are smoothed like enemies
    for (const d of tw.drones) {
      d.mesh.position.lerpVectors(d.prev, d.pos, alpha);
      d.mesh.position.y += Math.sin(t * 6 + tw.id + d.ang) * 0.015;
      d.mesh.rotation.y = lerpAngle(d.mesh.rotation.y, d.yaw, 1 - Math.exp(-10 * dt));
      d.mesh.rotation.z = Math.sin(t * 3 + d.ang) * 0.12;
      for (const r of d.mesh.userData.rotors) r.rotation.z += dt * 40;
    }
  }
  // Projectiles leave a short glowing trail
  for (const p of state.projectiles) {
    p.mesh.position.lerpVectors(p.prev, p.pos, alpha);
    if (p.mesh.userData.look === 'arrow') p.mesh.lookAt(p.aim);
    if (vdt > 0) {
      Particles.trail(p.mesh.position, p.color, p.kind === 'shell' ? 0.3 : p.kind === 'fireball' ? 0.25 : 0.14);
      if (p.kind === 'fireball' && Math.random() < 0.6) Particles.burst(p.mesh.position, { count: 1, color: 0xffcf5a, speed: 0.4, up: 0.6, lifeTime: 0.3, gravity: -0.5 });
    }
  }
  // Burning ground flickers
  for (const z of state.zones) {
    const d = z.mesh.userData.disc;
    d.material.opacity = Math.min(1, z.time * 2) * (0.5 + Math.sin(t * 12 + z.pos.x * 7) * 0.12);
    if (vdt > 0 && Math.random() < vdt * 12 * Q.fx) { const a = Math.random() * Math.PI * 2, rr = Math.random() * z.radius; Particles.burst(tmpV.set(z.pos.x + Math.cos(a) * rr, PATH_H + 0.05, z.pos.z + Math.sin(a) * rr), { count: 1, color: Math.random() < 0.5 ? 0xff7a2e : 0xffcf5a, speed: 0.2, up: 1.3, lifeTime: 0.5, gravity: -0.8 }); }
  }
  Fx.update(vdt);
  // Sold towers scan out top-down
  for (let i = fx.vanishing.length - 1; i >= 0; i--) {
    const v = fx.vanishing[i];
    v.t += dt;
    const k = Math.min(1, v.t / v.dur);
    const h = v.top - (v.top - v.base) * k;
    v.clip.constant = h;
    v.ring.position.set(v.mesh.position.x, h, v.mesh.position.z);
    v.ring.material.opacity = 0.9 * (1 - k * 0.5);
    if (k >= 1) { scene.remove(v.mesh); scene.remove(v.ring); v.ring.material.dispose(); fx.vanishing.splice(i, 1); }
  }
  // Defeated enemies de-materialise
  for (let i = fx.dissolving.length - 1; i >= 0; i--) {
    const d = fx.dissolving[i];
    d.t += dt;
    const k = Math.min(1, d.t / d.dur);
    const h = d.top - (d.top - d.base) * k;
    d.clip.constant = h;
    d.ring.position.set(d.mesh.position.x, h, d.mesh.position.z);
    d.ring.material.opacity = 0.9 * (1 - k);
    if (Math.random() < 0.6) Particles.trail(tmpV.set(d.mesh.position.x + (Math.random() - 0.5) * 0.4, h, d.mesh.position.z + (Math.random() - 0.5) * 0.4), STYLE.palette.holo, 0.35);
    if (k >= 1) { scene.remove(d.mesh); scene.remove(d.ring); d.ring.material.dispose(); d.mats.forEach((m) => m.dispose()); fx.dissolving.splice(i, 1); }
  }
  // Crystal and portal
  if (crystal) {
    const c = crystal;
    c.mesh.rotation.y += dt * 0.9;
    c.mesh.position.y = 0.78 + Math.sin(t * 1.6) * 0.05;
    c.halo.rotation.set(Math.PI / 2 + Math.sin(t * 0.7) * 0.5, t * 0.8, 0);
    c.ringB.rotation.set(Math.PI / 2 + Math.cos(t * 0.9) * 0.6, -t * 1.1, 0.4);
    c.runeDisc.rotation.z -= dt * 0.25;
    c.hurt = Math.max(0, c.hurt - dt * 2);
    const flicker = c.hurt > 0 ? (Math.random() < 0.5 ? 0.4 : 1) : 1;   // flickers when hit
    c.mat.emissive.setRGB(0.16 + c.hurt * 0.9, 0.8 - c.hurt * 0.55, 1 - c.hurt * 0.6);
    c.mat.emissiveIntensity = (0.85 + Math.sin(t * 2.2) * 0.25) * flicker + c.hurt * 1.2;
    c.light.color.setRGB(0.37 + c.hurt * 0.63, 0.88 - c.hurt * 0.55, 1 - c.hurt * 0.5);
    c.light.intensity = (3.6 + Math.sin(t * 2.2) * 0.8) * flicker + c.hurt * 5;
    c.edgeMat.emissiveIntensity = 1.6 + Math.sin(t * 2.2) * 0.5;
    const lowLife = state.lives > 0 && state.lives <= 5 && state.phase === 'wave';
    c.group.scale.setScalar(1 + c.hurt * 0.1 + (lowLife ? Math.sin(t * 8) * 0.02 : 0));
  }
  if (portal) {
    const busy = state.phase === 'wave' ? 1 : 0;
    portal.swirl.rotation.z -= dt * (1.6 + busy * 2.2);
    portal.runeDisc.rotation.z += dt * 0.4;
    portal.light.intensity = 2.5 + Math.sin(t * 3) * 0.6 + busy * 1.8;
    portal.swirl.material.opacity = 0.7 + Math.sin(t * 4) * 0.12 + busy * 0.15;
    portal.ringMat.emissiveIntensity = 2 + Math.sin(t * 5) * 0.5 + busy;
    portal.lampMat.emissiveIntensity = 2 + (Math.sin(t * (busy ? 9 : 2.5)) > 0 ? 1.2 : 0);
  }
  // Ambient: flowing path chevrons, pulsing edge lights, blinking beacons
  if (ambient.pathTex) ambient.pathTex.offset.y -= dt * 0.9;
  for (const gl of ambient.glows) {
    const v = gl.base + Math.sin(t * gl.speed) * gl.amp;
    if (gl.opacity) gl.mat.opacity = v; else gl.mat.emissiveIntensity = v;
  }
  for (const b of ambient.beacons) b.mat.emissiveIntensity = Math.sin(t * b.speed * 3 + b.phase) > 0.6 ? 3 : 0.3;
  if (MODELS._goblin) MODELS._goblin.packLight.emissiveIntensity = Math.sin(t * 6) > 0 ? 2.5 : 0.4;
  // Fireflies drift on their own
  if (fireflies) {
    const { seeds, pos, pts } = fireflies;
    for (let i = 0; i < seeds.length; i++) {
      const s = seeds[i];
      pos[i * 3] = s.x + Math.sin(t * s.sp + s.p) * 0.6;
      pos[i * 3 + 1] = s.y + Math.sin(t * s.sp * 1.7 + s.p * 2) * 0.25;
      pos[i * 3 + 2] = s.z + Math.cos(t * s.sp * 0.8 + s.p) * 0.6;
    }
    pts.geometry.attributes.position.needsUpdate = true;
    pts.material.opacity = 0.55 + Math.sin(t * 1.3) * 0.2;
  }
}
const tmpQ = new THREE.Quaternion();
function easeOutBack(x) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

/* Pause automatically when the app goes to the background */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state.phase === 'wave' || state.phase === 'ready') && !state.paused) togglePause();
});

/* =====================================================================
   BOOT
   ===================================================================== */
applyQuality();
map = buildMapModel(CONTENT.maps[CURRENT_MAP]);
buildBoard();
resetGame();
renderCards();
updateHud(true);
fitCamera();
showTitle();
$('boot').hidden = true;
window.__asdBooted = true;
requestAnimationFrame((t) => { last = t; frame(t); });

// Handy for testing in the browser console
window.ASD = {
  state, CONTENT, startWave, buildTower, upgradeTower, setTargeting, setMode, startRun, step, map: () => map,
  tileToScreen(c, r) { const v = map.toWorld(c, r, TILE_H).project(camera); return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight }; },
};
</script>
<script>
  // If the 3D engine can't load (no internet, blocked CDN), say so instead of showing a blank page.
  setTimeout(function () {
    if (!window.__asdBooted) {
      document.getElementById('boot').innerHTML = 'Couldn’t load the 3D engine.<br>Check your internet connection, then reload the page.';
    }
  }, 15000);
  window.addEventListener('error', function (e) {
    if (!window.__asdBooted) document.getElementById('boot').textContent = 'Something went wrong while loading: ' + (e.message || 'unknown error');
  });
</script>
