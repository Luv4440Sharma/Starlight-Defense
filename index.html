<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b14">
<title>Arcane &amp; Starlight Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b14;
    --panel: linear-gradient(180deg, rgba(14, 24, 38, 0.86), rgba(8, 13, 24, 0.86));
    --panel-solid: #0d1624;
    --line: rgba(88, 230, 255, 0.22);
    --line-soft: rgba(88, 230, 255, 0.1);
    --text: #e6f6ff;
    --muted: #8fa6bd;
    --cyan: #58e6ff;
    --teal: #36e0c4;
    --violet: #b07cff;
    --gold: #ffcf5a;
    --red: #ff5f74;
    --green: #5dffb0;
    --font: "Rajdhani", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --font-display: "Orbitron", "Rajdhani", system-ui, sans-serif;
    --cut: 9px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: var(--font);
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  /* Sci-fi panel: cut corners, thin cyan edge, corner brackets */
  .glass {
    position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: inset 0 0 18px rgba(88, 230, 255, 0.06), inset 0 1px 0 rgba(160, 245, 255, 0.12);
  }
  .glass::before, .glass::after {
    content: ""; position: absolute; width: 10px; height: 10px; pointer-events: none; border-color: var(--cyan); opacity: 0.85;
  }
  .glass::before { top: 0; right: 0; border-top: 2px solid; border-right: 2px solid; }
  .glass::after { bottom: 0; left: 0; border-bottom: 2px solid; border-left: 2px solid; }
  .num { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.5px; }

  /* ---------- Top HUD ---------- */
  #hud {
    position: fixed; top: calc(8px + var(--safe-t)); left: calc(10px + var(--safe-l)); right: calc(10px + var(--safe-r));
    display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 5;
  }
  .hud-group { display: flex; gap: 8px; pointer-events: auto; }
  .pill {
    display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px 0 10px;
    font-size: 16px; font-variant-numeric: tabular-nums;
  }
  .pill span:not(.label) { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: 0.5px; }
  .pill svg { width: 20px; height: 20px; flex: none; filter: drop-shadow(0 0 4px currentColor); }
  .pill .label { font-weight: 700; color: var(--muted); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
  #lives-pill { color: var(--red); } #lives-pill span { color: var(--text); }
  #coins-pill { color: var(--gold); } #coins-pill span { color: #ffe39a; }
  #wave-pill { color: var(--cyan); } #wave-pill span:not(.label) { color: var(--text); }
  .pill.bump { animation: bump 0.35s ease-out; }
  .pill.hurt { animation: hurt 0.45s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
  @keyframes hurt { 0% { transform: translateX(0); background: rgba(255, 60, 90, 0.6); } 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 100% { transform: translateX(0); } }
  .icon-btn {
    width: 40px; height: 38px; display: grid; place-items: center; padding: 0; font-family: var(--font-display); font-weight: 800; font-size: 13px; color: var(--cyan);
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn.on { color: var(--gold); }
  .icon-btn.on::before, .icon-btn.on::after { border-color: var(--gold); }

  /* ---------- Bottom build bar ---------- */
  #bottom-bar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(8px + var(--safe-b));
    display: flex; gap: 8px; align-items: stretch; padding: 6px; z-index: 5; max-width: calc(100% - 20px);
  }
  .tower-card {
    position: relative; display: flex; align-items: center; gap: 9px; min-width: 164px; height: 56px; padding: 6px 26px 6px 6px;
    border-radius: 2px; border: 1px solid var(--line-soft); background: rgba(88, 230, 255, 0.04); text-align: left;
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    transition: transform 0.12s, border-color 0.15s, background 0.15s, opacity 0.15s;
  }
  .tower-card:active { transform: scale(0.97); }
  .tower-card .ico { width: 44px; height: 44px; border-radius: 2px; display: grid; place-items: center; flex: none; }
  .tower-card .ico svg { width: 30px; height: 30px; }
  .tower-card .nm { font-weight: 700; font-size: 15px; line-height: 1.05; letter-spacing: 0.3px; }
  .tower-card .cost { display: flex; align-items: center; gap: 4px; margin-top: 3px; color: var(--gold); font-family: var(--font-display); font-weight: 800; font-size: 12px; }
  .tower-card .cost svg { width: 13px; height: 13px; }
  .tower-card .key {
    position: absolute; top: 4px; right: 6px; font-size: 10px; color: var(--muted); border: 1px solid var(--line-soft);
    padding: 0 4px; line-height: 14px; font-family: var(--font-display);
  }
  .tower-card.active { border-color: var(--cyan); background: rgba(88, 230, 255, 0.15); box-shadow: 0 0 0 1px var(--cyan) inset, inset 0 0 22px rgba(88, 230, 255, 0.25); }
  .tower-card.poor { opacity: 0.5; }
  .tower-card.poor .cost { color: var(--red); }
  #start-wave {
    border: 0; padding: 0 18px; min-width: 132px; color: #021219;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    background: linear-gradient(180deg, #8ff4ff, #22c8e6); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  }
  #start-wave span { font-family: var(--font-display); font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  #start-wave small { font-weight: 700; font-size: 12px; opacity: 0.75; }
  #start-wave:disabled { background: rgba(88, 230, 255, 0.07); color: var(--muted); cursor: default; }
  #start-wave:not(:disabled) { animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow { 50% { filter: brightness(1.25) drop-shadow(0 0 10px rgba(88, 230, 255, 0.9)); } }

  /* ---------- Tower info panel ---------- */
  #tower-info {
    position: fixed; right: calc(10px + var(--safe-r)); top: calc(56px + var(--safe-t)); width: 216px; padding: 12px; z-index: 6;
    transform-origin: top right; animation: pop 0.16s ease-out;
  }
  #tower-info[hidden] { display: none; }
  @keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #tower-info h3 { margin: 0 0 2px; font-family: var(--font-display); font-size: 14px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--cyan); }
  #tower-info .role { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; border-top: 1px solid var(--line-soft); }
  .stat-row span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }
  .info-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    flex: 1; height: 36px; border-radius: 2px; border: 1px solid var(--line); background: rgba(88, 230, 255, 0.07); font-weight: 700; font-size: 14px;
    letter-spacing: 0.5px; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  .btn:active { transform: scale(0.97); }
  .btn.danger { color: #ffd2d9; border-color: rgba(255, 95, 116, 0.55); background: rgba(255, 95, 116, 0.15); }
  .btn.primary { color: #021219; border: 0; background: linear-gradient(180deg, #8ff4ff, #22c8e6); font-family: var(--font-display); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .btn.ghost { background: transparent; }
  .btn.sel { border-color: var(--cyan); background: rgba(88, 230, 255, 0.2); color: var(--cyan); }

  /* ---------- Floaters, toast, hints, banner ---------- */
  #floaters { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
  .floater {
    position: absolute; left: 0; top: 0; font-family: var(--font-display); font-weight: 800; font-size: 14px; white-space: nowrap; will-change: transform, opacity;
    text-shadow: 0 0 8px currentColor, 0 2px 4px rgba(0, 0, 0, 0.9);
  }
  .floater.gold { color: var(--gold); }
  .floater.red { color: var(--red); font-size: 18px; }
  #place-hint {
    position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; font-size: 13px; font-weight: 700; padding: 5px 9px;
    background: rgba(5, 12, 20, 0.88); border: 1px solid rgba(93, 255, 176, 0.55); color: var(--green); white-space: nowrap;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  #place-hint.bad { border-color: rgba(255, 95, 116, 0.55); color: var(--red); }
  #place-hint[hidden] { display: none; }
  #toast {
    position: fixed; left: 50%; top: calc(56px + var(--safe-t)); transform: translate(-50%, -8px); z-index: 7; pointer-events: none;
    padding: 9px 16px; font-weight: 700; font-size: 15px; opacity: 0; transition: opacity 0.2s, transform 0.2s; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.warn { color: #ffd2d9; }
  #toast.warn::before, #toast.warn::after { border-color: var(--red); }
  #banner {
    position: fixed; left: 0; right: 0; top: 32%; z-index: 7; pointer-events: none; display: flex; flex-direction: column; align-items: center;
    opacity: 0;
  }
  #banner .bar {
    width: min(560px, 92vw); padding: 10px 0 9px; text-align: center; position: relative;
    background: linear-gradient(90deg, transparent, rgba(6, 22, 34, 0.88) 18%, rgba(6, 22, 34, 0.88) 82%, transparent);
  }
  #banner .bar::before, #banner .bar::after {
    content: ""; position: absolute; left: 8%; right: 8%; height: 1px; background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  }
  #banner .bar::before { top: 0; } #banner .bar::after { bottom: 0; }
  #banner .t { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: 6px; color: #dffbff; text-shadow: 0 0 14px rgba(88, 230, 255, 0.85); }
  #banner .s { font-size: 14px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); margin-top: 2px; }
  #banner.clear .t { text-shadow: 0 0 14px rgba(93, 255, 176, 0.85); }
  #banner.clear .s { color: var(--green); }
  #banner.clear .bar::before, #banner.clear .bar::after { background: linear-gradient(90deg, transparent, var(--green), transparent); }
  #banner.show { animation: banner 2.1s ease-out forwards; }
  @keyframes banner {
    0% { opacity: 0; transform: scaleX(0.3); filter: brightness(2.2); }
    12% { opacity: 1; transform: scaleX(1.03); filter: brightness(1.4); }
    20% { transform: scaleX(1); filter: brightness(1); }
    80% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-14px); }
  }
  #rotate-hint {
    position: fixed; left: 50%; bottom: calc(84px + var(--safe-b)); transform: translateX(-50%); z-index: 4; font-size: 13px;
    color: var(--muted); padding: 6px 12px; pointer-events: none; white-space: nowrap;
  }
  #rotate-hint[hidden] { display: none; }
  #fps { position: fixed; left: calc(10px + var(--safe-l)); bottom: calc(8px + var(--safe-b)); z-index: 8; font: 600 11px ui-monospace, monospace; color: var(--green); padding: 3px 8px; }
  #fps[hidden] { display: none; }

  /* ---------- Overlays ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(ellipse at center, rgba(4, 10, 20, 0.5), rgba(2, 5, 11, 0.88));
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fade 0.25s ease-out;
  }
  #overlay[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .card {
    width: min(450px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px 22px 18px; text-align: center;
    background: linear-gradient(180deg, rgba(12, 26, 40, 0.97), rgba(6, 12, 22, 0.97));
    box-shadow: inset 0 0 40px rgba(88, 230, 255, 0.07);
    animation: pop 0.22s ease-out;
    --cut: 16px;
  }
  .card::before, .card::after { width: 18px; height: 18px; }
  .card .eyebrow { font-family: var(--font-display); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); font-weight: 800; }
  .card h1 { margin: 8px 0 4px; font-family: var(--font-display); font-size: 23px; line-height: 1.2; letter-spacing: 1px; font-weight: 800;
    background: linear-gradient(90deg, #c9a6ff, #ffffff 45%, #7ff0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card h2 { margin: 8px 0 4px; font-family: var(--font-display); font-size: 20px; letter-spacing: 1px; }
  .card p { color: var(--muted); font-size: 15px; line-height: 1.4; margin: 8px 0; }
  .card ul { text-align: left; color: var(--muted); font-size: 14.5px; line-height: 1.45; padding-left: 20px; margin: 10px 0 14px; }
  .card ul b { color: var(--text); }
  .card .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .card .stat { border: 1px solid var(--line-soft); padding: 8px 4px; background: rgba(88, 230, 255, 0.04); }
  .card .stat b { display: block; font-family: var(--font-display); font-size: 19px; font-variant-numeric: tabular-nums; }
  .card .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
  .card .actions { display: flex; gap: 10px; margin-top: 14px; }
  .card .actions .btn { height: 44px; font-size: 14px; }
  .card .foot { margin-top: 12px; font-size: 12px; color: #5f7590; }
  .card .setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); text-align: left; }
  .card .setting b { display: block; font-size: 15px; }
  .card .setting small { color: var(--muted); font-size: 13px; }
  .card .seg { display: flex; gap: 6px; flex: none; }
  .card .seg .btn { min-width: 62px; height: 34px; flex: none; }
  .win h2 { color: var(--green); text-shadow: 0 0 12px rgba(93, 255, 176, 0.6); }
  .lose h2 { color: var(--red); text-shadow: 0 0 12px rgba(255, 95, 116, 0.6); }

  #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; background: var(--bg); color: var(--cyan); font-family: var(--font-display); letter-spacing: 2px; font-size: 13px; padding: 24px; text-align: center; }
  #boot[hidden] { display: none; }

  @media (max-height: 460px) {
    .pill { height: 34px; }
    .icon-btn { height: 34px; width: 38px; }
    .tower-card { height: 50px; min-width: 144px; }
    .tower-card .ico { width: 38px; height: 38px; }
    #tower-info { top: calc(50px + var(--safe-t)); width: 200px; padding: 10px; }
    .card { padding: 16px 18px 14px; }
    .card h1 { font-size: 19px; }
    .card ul { margin: 6px 0 8px; }
    #banner { top: 26%; }
    #banner .t { font-size: 21px; }
  }
  @media (max-width: 520px) {
    .pill .label { display: none; }
    .pill { padding: 0 10px 0 8px; gap: 5px; }
    .hud-group { gap: 6px; }
    #banner .t { font-size: 19px; letter-spacing: 4px; }
  }
</style>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="Game board"></canvas>

<div id="hud">
  <div class="hud-group">
    <div class="pill glass" id="lives-pill" title="Crystal lives">
      <svg viewBox="0 0 24 24"><path fill="#ff6b7a" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <span id="lives">20</span>
    </div>
    <div class="pill glass" id="coins-pill" title="Coins">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#f5b730"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="#ffe08a" stroke-width="1.6"/><path d="M12 8.2v7.6M9.8 10h3.6a1.4 1.4 0 0 1 0 2.8h-2.8a1.4 1.4 0 0 0 0 2.8h3.6" stroke="#8a5a00" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      <span id="coins">0</span>
    </div>
    <div class="pill glass" id="wave-pill" title="Wave">
      <svg viewBox="0 0 24 24"><path d="M3 15c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 3 3M3 10c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 3 3" stroke="#7fd8ff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span class="label">Wave</span><span id="wave">0/1</span>
    </div>
  </div>
  <div class="hud-group">
    <button class="icon-btn glass" id="speed-btn" title="Game speed (F)" aria-label="Game speed">1×</button>
    <button class="icon-btn glass" id="settings-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.3 7.3 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.3 7.3 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.3 7.3 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
    <button class="icon-btn glass" id="pause-btn" title="Pause (Space)" aria-label="Pause">
      <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<div id="bottom-bar" class="glass">
  <div id="tower-cards" style="display:flex; gap:8px"></div>
  <button id="start-wave"><span id="start-wave-label">Start wave</span><small id="start-wave-sub"></small></button>
</div>

<div id="tower-info" class="glass" hidden></div>
<div id="toast" class="glass"></div>
<div id="banner"><div class="bar"><div class="t" id="banner-t"></div><div class="s" id="banner-s"></div></div></div>
<div id="floaters"></div>
<div id="place-hint" hidden></div>
<div id="rotate-hint" class="glass" hidden>Turn your phone sideways for a bigger board</div>
<div id="fps" class="glass" hidden></div>
<div id="overlay" hidden></div>
<div id="boot">BOOTING DEFENSE GRID…</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   CONTENT — towers, enemies and maps are plain data.
   Later phases add entries here; the engine reads whatever is listed.
   Distances are in tiles, times in seconds.
   ===================================================================== */
const CONTENT = {
  towers: {
    arcaneArcher: {
      name: 'Arcane Archer',
      side: 'fantasy',
      role: 'Single target, long range, fast',
      cost: 50,
      sellRefund: 0.7,          // share of total spent returned on sale
      range: 3.4,
      fireRate: 1.6,            // shots per second
      damage: 13,
      damageType: 'pierce',
      projectileSpeed: 15,
      targeting: 'first',       // furthest along the path
      model: 'arcaneArcher',
      color: 0x8fc8ff,
      hotkey: '1',
    },
  },
  enemies: {

function canvasTex(size, draw, { repeat = false, srgb = true } = {}) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
function makeGradientTexture(stops) {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 256);
  stops.forEach((s, i) => grd.addColorStop(i / (stops.length - 1), s));
  g.fillStyle = grd;
  g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const STYLE = {

    moss: 0x4f8a3a, mossDark: 0x2c5226, leaf: 0x2a5a34, leafDark: 0x1c3f2a, bark: 0x3b2c22,
  },
  _cache: {},
  /* Shared metal material (cached by its settings) */
  metal(color, roughness = 0.45, metalness = 0.75) {
    const k = `m${color}_${roughness}_${metalness}`;
    return (this._cache[k] ||= new THREE.MeshStandardMaterial({ color, roughness, metalness }));
  },
  /* Shared matte material */
  matte(color, roughness = 0.9) {
    const k = `d${color}_${roughness}`;
    return (this._cache[k] ||= new THREE.MeshStandardMaterial({ color, roughness, metalness: 0 }));
  },
  /* Glowing part. New each time, since glows are animated per object. */
  glow(color, intensity = 2) {
    return new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensity, roughness: 0.35, metalness: 0.1 });
  },
  /* See-through hologram surface */
  holo(color, opacity = 0.55, map = null) {
    return new THREE.MeshBasicMaterial({ color, map, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false });
  },
};

/* Seeded random so the board looks the same every visit */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* =====================================================================
   MAP MODEL — grid, path tiles and the walkable polyline
   ===================================================================== */
const TILE_H = 0.22;   // top of a buildable tile
const PATH_H = 0.12;   // top of a path tile

function buildMapModel(def) {
  const { cols, rows } = def;
  const toWorld = (c, r, y = 0) => new THREE.Vector3(c - cols / 2 + 0.5, y, r - rows / 2 + 0.5);
  const key = (c, r) => c + ',' + r;
  const pathTiles = new Set();
  const wps = def.path;
  for (let i = 0; i < wps.length - 1; i++) {
    let [c, r] = wps[i];
    const [c1, r1] = wps[i + 1];
    const dc = Math.sign(c1 - c), dr = Math.sign(r1 - r);
    while (true) {
      if (c >= 0 && c < cols && r >= 0 && r < rows) pathTiles.add(key(c, r));
      if (c === c1 && r === r1) break;
      c += dc; r += dr;
    }
  }
  const points = wps.map(([c, r]) => toWorld(c, r, PATH_H));
  const segLens = [];
  let total = 0;
  for (let i = 0; i < points.length - 1; i++) {
    const L = points[i].distanceTo(points[i + 1]);
    segLens.push(L);
    total += L;
  }
  const [cc, cr] = wps[wps.length - 1];
  return {
    def, cols, rows, toWorld, key, pathTiles, points, segLens, total,
    crystalTile: { c: cc, r: cr },
    inside: (c, r) => c >= 0 && c < cols && r >= 0 && r < rows,
    isPath: (c, r) => pathTiles.has(key(c, r)),
  };
}

/* Position and heading at a distance along the path */
function samplePath(model, dist, out) {
  let d = Math.max(0, dist);
  const n = model.segLens.length;
  for (let i = 0; i < n; i++) {
    const L = model.segLens[i];
    if (d <= L || i === n - 1) {
      const a = model.points[i], b = model.points[i + 1];
      out.lerpVectors(a, b, L > 0 ? Math.min(d / L, 1) : 0);
      return Math.atan2(b.x - a.x, b.z - a.z);
    }
    d -= L;
  }
  return 0;
}

/* =====================================================================
   MODELS — Style D. Built from simple shapes plus the style kit.
   ===================================================================== */
function shadowed(obj) { obj.traverse((o) => { if (o.isMesh) { o.castShadow = !o.userData.noShadow; o.receiveShadow = true; } }); return obj; }
function noShadow(...meshes) { meshes.forEach((m) => (m.userData.noShadow = true)); }
const mesh = (geo, material, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, material); m.position.set(x, y, z); return m; };

/* Give an object its own copies of every material (so it can be clipped or
   faded without touching anything else). References in userData follow. */
function ownMaterials(obj) {
  const map = new Map();
  obj.traverse((o) => {
    if (!o.isMesh && !o.isSprite) return;
    if (!map.has(o.material)) map.set(o.material, o.material.clone());
    o.material = map.get(o.material);
  });
  const u = obj.userData;
  for (const k in u) if (u[k] && u[k].isMaterial && map.has(u[k])) u[k] = map.get(u[k]);
  return [...map.values()];
}

      const tipL = mesh(tipGeo, glow, -0.26, 0.13, 0.12), tipR = mesh(tipGeo, glow, 0.26, 0.13, 0.12);

      recoil.add(rail, railLight, bow, bowCore, string, tipL, tipR, bolt, gem);

      g.add(base, baseTop, edge, runeRing, column, fins, band, head);

      shadowed(g);
      g.userData = { head, recoil, glow, bolt, gem, gemMat, holoMat, runeMat, runeRing, muzzleY: 0.87, height: 1.0, radius: 0.46 };

  },
  enemies: {

      pad.rotation.z = 0.4;

      const earR = earL.clone();
      earR.position.x = 0.14;
      earR.rotation.z = -Math.PI / 2.4;
      const visor = mesh(G.visor, G.visorMat, 0, 0.49, 0.135);
      const pack = mesh(G.pack, G.packMat, 0, 0.3, -0.17);
      const antenna = mesh(G.antenna, G.armor, 0.05, 0.47, -0.19);
      const light = mesh(G.dot, G.packLight, 0.05, 0.575, -0.19);
      const armL = mesh(G.arm, skin, -0.19, 0.24, 0.02);
      armL.rotation.z = 0.35;
      const armR = armL.clone();

      armR.rotation.z = -0.35;
      bob.add(body, chest, pad, head, earL, earR, visor, pack, antenna, light, armL, armR);
      g.add(bob);
      shadowed(g);
      g.userData = { bob, armL, armR, height: 0.62 };

/* =====================================================================
   BOARD — overgrown outpost: metal deck, hologram path, forest around
   ===================================================================== */
let map;                 // map model
const boardGroup = new THREE.Group();
scene.add(boardGroup);
let crystal = null;      // energy core
let portal = null;       // rift gate
const ambient = { pathTex: null, glows: [], beacons: [] };

function buildBoard() {
  boardGroup.clear();
  ambient.glows = []; ambient.beacons = [];
  const { cols, rows } = map;
  const P = STYLE.palette;
  const rand = mulberry32(7);

  // Forest floor
  const ground = mesh(new THREE.PlaneGeometry(140, 140), STYLE.matte(0x0c1a12, 1), 0, -0.8, 0);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  boardGroup.add(ground);

  // Outpost platform with lit edge strips
  const slab = mesh(new THREE.BoxGeometry(cols + 0.8, 0.8, rows + 0.8), STYLE.metal(0x1c232d, 0.7, 0.6), 0, -0.4, 0);
  slab.receiveShadow = slab.castShadow = true;
  const trim = mesh(new THREE.BoxGeometry(cols + 0.9, 0.06, rows + 0.9), STYLE.metal(P.steel, 0.4, 0.8), 0, -0.03, 0);
  trim.receiveShadow = true;
  boardGroup.add(slab, trim);
  const edgeGlow = STYLE.glow(P.holo, 1.5);
  const sideGlow = STYLE.glow(P.teal, 0.9);
  ambient.glows.push({ mat: edgeGlow, base: 1.5, amp: 0.35, speed: 1.3 });
  const W = cols + 0.92, D = rows + 0.92;
  for (const [w, d, x, z] of [[W, 0.03, 0, D / 2], [W, 0.03, 0, -D / 2], [0.03, D, W / 2, 0], [0.03, D, -W / 2, 0]]) {
    boardGroup.add(mesh(new THREE.BoxGeometry(w, 0.025, d), edgeGlow, x, 0.0, z));
    boardGroup.add(mesh(new THREE.BoxGeometry(w + (d < 0.1 ? 0 : 0.01), 0.02, d + (w < 0.1 ? 0 : 0.01)), sideGlow, x * 1.001, -0.5, z * 1.001));
  }

  // Deck tiles and path gratings (one draw call each)
  let deckCount = 0, pathCount = 0;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) (map.isPath(c, r) ? pathCount++ : deckCount++);
  const deck = new THREE.InstancedMesh(new THREE.BoxGeometry(0.95, TILE_H, 0.95), new THREE.MeshStandardMaterial({ map: deckTex, roughness: 0.5, metalness: 0.65 }), deckCount);
  const pathMat = new THREE.MeshStandardMaterial({ map: grateTex, roughness: 0.7, metalness: 0.6 });
  const path = new THREE.InstancedMesh(new THREE.BoxGeometry(1.0, PATH_H, 1.0), pathMat, pathCount);
  deck.receiveShadow = path.receiveShadow = true;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(1, 1, 1), up = new THREE.Vector3(0, 1, 0);
  const col = new THREE.Color();
  const deckSpots = [];
  let di = 0, pi = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const p = map.toWorld(c, r);
      if (map.isPath(c, r)) {
        m4.makeTranslation(p.x, PATH_H / 2, p.z);
        path.setMatrixAt(pi, m4);
        col.setHSL(0.6, 0.12, 0.26 + (rand() - 0.5) * 0.04);
        path.setColorAt(pi++, col);
      } else {
        q.setFromAxisAngle(up, Math.floor(rand() * 4) * (Math.PI / 2));
        m4.compose(new THREE.Vector3(p.x, TILE_H / 2, p.z), q, sc);
        deck.setMatrixAt(di, m4);
        const mossy = rand() < 0.22;
        if (mossy) col.setHSL(0.27 + rand() * 0.04, 0.2, 0.27 + rand() * 0.04);
        else col.setHSL(0.59, 0.1 + rand() * 0.04, 0.33 + ((c + r) % 2 ? 0.02 : -0.02) + (rand() - 0.5) * 0.04);
        deck.setColorAt(di++, col);
        deckSpots.push({ c, r, p, mossy });
      }
    }
  }
  deck.instanceColor.needsUpdate = path.instanceColor.needsUpdate = true;
  boardGroup.add(deck, path);

  // Hologram path: a glowing ribbon of chevrons that flows toward the core
  ambient.pathTex = chevronTex.clone();
  ambient.pathTex.needsUpdate = true;
  ambient.pathTex.wrapS = ambient.pathTex.wrapT = THREE.RepeatWrapping;
  const ribbonMat = STYLE.holo(P.holo, 0.5, ambient.pathTex);
  const nodeMat = STYLE.holo(P.holo, 0.55, dotTex);
  const HW = 0.2, y = PATH_H + 0.006;
  let along = 0;
  for (let i = 0; i < map.points.length - 1; i++) {
    const a = map.points[i], b = map.points[i + 1];
    const dir = new THREE.Vector3().subVectors(b, a).setY(0).normalize();
    const side = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(HW);
    const L = a.distanceTo(b);
    const v0 = along * 2.2, v1 = (along + L) * 2.2;
    along += L;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([
      a.x - side.x, y, a.z - side.z, a.x + side.x, y, a.z + side.z, b.x - side.x, y, b.z - side.z, b.x + side.x, y, b.z + side.z,
    ], 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, v0, 1, v0, 0, v1, 1, v1], 2));
    geo.setIndex([0, 2, 1, 1, 2, 3]);
    const ribbon = new THREE.Mesh(geo, ribbonMat);
    ribbon.renderOrder = 2;
    boardGroup.add(ribbon);
    if (i > 0) {
      const node = mesh(new THREE.CircleGeometry(0.42, 24), nodeMat, a.x, y + 0.002, a.z);
      node.rotation.x = -Math.PI / 2;
      node.renderOrder = 2;
      boardGroup.add(node);
    }
  }
  ambient.glows.push({ mat: ribbonMat, base: 0.5, amp: 0.1, speed: 2, opacity: true });

  // Overgrowth: moss clumps on deck tiles and slab edges
  const mossGeo = new THREE.IcosahedronGeometry(0.13, 0);
  const mossMat = STYLE.matte(0xffffff, 1);
  const mossSpots = [];
  for (const s of deckSpots) {
    const n = s.mossy ? 2 + Math.floor(rand() * 3) : rand() < 0.18 ? 1 : 0;
    for (let k = 0; k < n; k++) {
      const ex = rand() < 0.5 ? (rand() < 0.5 ? -0.4 : 0.4) : (rand() - 0.5) * 0.8;
      const ez = Math.abs(ex) === 0.4 ? (rand() - 0.5) * 0.8 : (rand() < 0.5 ? -0.4 : 0.4);
      mossSpots.push([s.p.x + ex, TILE_H, s.p.z + ez, 0.6 + rand() * 0.8]);
    }
  }
  for (let k = 0; k < 46; k++) {   // along the platform rim
    const onX = rand() < 0.62;
    const x = onX ? (rand() - 0.5) * (cols + 0.6) : (rand() < 0.5 ? -1 : 1) * (cols / 2 + 0.38);
    const z = onX ? (rand() < 0.5 ? -1 : 1) * (rows / 2 + 0.38) : (rand() - 0.5) * (rows + 0.6);
    mossSpots.push([x, 0.01, z, 0.9 + rand() * 0.9]);
  }
  const moss = new THREE.InstancedMesh(mossGeo, mossMat, mossSpots.length);
  mossSpots.forEach(([x, yy, z, s], i) => {
    q.setFromAxisAngle(up, rand() * 6.28);
    m4.compose(new THREE.Vector3(x, yy, z), q, new THREE.Vector3(s, s * 0.38, s));
    moss.setMatrixAt(i, m4);
    col.setHex(rand() < 0.5 ? P.moss : P.mossDark).offsetHSL(0, 0, (rand() - 0.5) * 0.06);
    moss.setColorAt(i, col);
  });
  moss.instanceColor.needsUpdate = true;
  moss.receiveShadow = true;
  boardGroup.add(moss);

  // Vines hanging over the platform sides
  const vineCount = 54;
  const vines = new THREE.InstancedMesh(new THREE.BoxGeometry(0.05, 1, 0.02), STYLE.matte(P.mossDark, 1), vineCount);
  for (let k = 0; k < vineCount; k++) {
    const len = 0.25 + rand() * 0.55;
    const side = Math.floor(rand() * 3);   // the front edge stays clear for the camera
    let x, z, ry = 0;
    if (side === 0) { x = (rand() - 0.5) * cols; z = -(rows / 2 + 0.415); }
    else { x = (side === 1 ? -1 : 1) * (cols / 2 + 0.415); z = (rand() - 0.5) * rows; ry = Math.PI / 2; }
    q.setFromEuler(new THREE.Euler(0, ry, (rand() - 0.5) * 0.25));
    m4.compose(new THREE.Vector3(x, -len / 2 + 0.02, z), q, new THREE.Vector3(1, len, 1));
    vines.setMatrixAt(k, m4);
  }
  boardGroup.add(vines);

  // Grass tufts poking through the deck seams
  const tuftSpots = deckSpots.filter(() => rand() < 0.3);
  const tufts = new THREE.InstancedMesh(new THREE.ConeGeometry(0.028, 0.17, 3), STYLE.matte(0x6aa84a, 0.9), tuftSpots.length * 3);
  let ti = 0;
  for (const s of tuftSpots) {
    const ox = (rand() < 0.5 ? -1 : 1) * 0.38, oz = (rand() - 0.5) * 0.7;
    for (let k = 0; k < 3; k++) {
      q.setFromEuler(new THREE.Euler((rand() - 0.5) * 0.6, 0, (rand() - 0.5) * 0.6));
      const h = 0.7 + rand() * 0.6;
      m4.compose(new THREE.Vector3(s.p.x + ox + (rand() - 0.5) * 0.08, TILE_H + 0.06 * h, s.p.z + oz + (rand() - 0.5) * 0.08), q, new THREE.Vector3(1, h, 1));
      tufts.setMatrixAt(ti++, m4);
    }
  }
  boardGroup.add(tufts);

  // Forest around the outpost (front edge gets low bushes so the board stays clear)
  buildForest(rand);

  // Corner antenna pylons with blinking tips
  const pylonMat = STYLE.metal(P.steel, 0.4, 0.8);
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const x = sx * (cols / 2 + 0.25), z = sz * (rows / 2 + 0.25);
    const mast = mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.7, 6), pylonMat, x, 0.35, z);
    const tipMat = STYLE.glow(sz < 0 ? P.holo : P.warn, 2.5);
    const tip = mesh(new THREE.SphereGeometry(0.05, 10, 8), tipMat, x, 0.72, z);
    noShadow(tip);
    boardGroup.add(shadowed(mast), tip);
    ambient.beacons.push({ mat: tipMat, phase: rand() * 6, speed: 1.2 + rand() });
  }

  buildCore();
  buildRiftGate();
  buildSpores();
}

function buildForest(rand) {
  const { cols, rows } = map;
  const P = STYLE.palette;
  const spots = [];
  const halfX = cols / 2 + 0.9, halfZ = rows / 2 + 0.9;
  const portalP = map.points[0];
  let guard = 0;
  while (spots.length < 96 && guard++ < 4000) {
    const x = (rand() - 0.5) * (cols + 16), z = (rand() - 0.5) * (rows + 13) - 1.2;
    if (Math.abs(x) < halfX && Math.abs(z) < halfZ) continue;                     // not on the platform
    if (Math.abs(z - portalP.z) < 1.3 && x < -cols / 2 && x > -cols / 2 - 4) continue; // keep the gate clear
    const front = z > rows / 2;
    const s = front ? 0.35 + rand() * 0.25 : 0.7 + rand() * 0.75;
    if (spots.some((o) => (o.x - x) ** 2 + (o.z - z) ** 2 < 0.55 * (o.s + s))) continue;
    spots.push({ x, z, s, pine: rand() < 0.65 });
  }
  const trunkGeo = new THREE.CylinderGeometry(0.06, 0.1, 0.7, 5);
  const coneGeo = new THREE.ConeGeometry(0.55, 1.1, 7);
  const roundGeo = new THREE.IcosahedronGeometry(0.55, 0);
  const pines = spots.filter((s) => s.pine), rounds = spots.filter((s) => !s.pine);
  const trunks = new THREE.InstancedMesh(trunkGeo, STYLE.matte(P.bark, 1), spots.length);
  const cones = new THREE.InstancedMesh(coneGeo, STYLE.matte(0xffffff, 0.95), pines.length * 2);
  const crowns = new THREE.InstancedMesh(roundGeo, STYLE.matte(0xffffff, 0.95), Math.max(1, rounds.length));
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color(), up = new THREE.Vector3(0, 1, 0);
  let ci = 0, ri = 0;
  spots.forEach((t, i) => {
    q.setFromAxisAngle(up, rand() * 6.28);
    m4.compose(new THREE.Vector3(t.x, -0.8 + 0.35 * t.s, t.z), q, new THREE.Vector3(t.s, t.s, t.s));
    trunks.setMatrixAt(i, m4);
    const tint = () => col.setHex(rand() < 0.5 ? P.leaf : P.leafDark).offsetHSL((rand() - 0.5) * 0.03, 0, (rand() - 0.5) * 0.05);
    if (t.pine) {
      for (let k = 0; k < 2; k++) {
        const sk = t.s * (1 - k * 0.28);
        m4.compose(new THREE.Vector3(t.x, -0.8 + t.s * (0.95 + k * 0.6), t.z), q, new THREE.Vector3(sk, sk, sk));
        cones.setMatrixAt(ci, m4);
        cones.setColorAt(ci++, tint());
      }
    } else {
      m4.compose(new THREE.Vector3(t.x, -0.8 + t.s * 1.1, t.z), q, new THREE.Vector3(t.s, t.s * 0.85, t.s));
      crowns.setMatrixAt(ri, m4);
      crowns.setColorAt(ri++, tint());
    }
  });
  if (cones.instanceColor) cones.instanceColor.needsUpdate = true;
  if (crowns.instanceColor) crowns.instanceColor.needsUpdate = true;
  crowns.count = ri;
  for (const m of [trunks, cones, crowns]) { m.castShadow = true; m.receiveShadow = true; }
  boardGroup.add(trunks, cones, crowns);

  // A few tech beacons hidden among the trees
  const poleMat = STYLE.metal(P.gunmetal, 0.5, 0.7);
  for (let k = 0; k < 7; k++) {
    const t = spots[Math.floor(rand() * spots.length)];
    if (!t || t.z > rows / 2) continue;
    const x = t.x + 0.5, z = t.z + 0.3;
    const pole = mesh(new THREE.CylinderGeometry(0.025, 0.04, 1.1, 5), poleMat, x, -0.25, z);
    const lampMat = STYLE.glow(rand() < 0.5 ? P.holo : P.rune, 2.4);
    const lamp = mesh(new THREE.SphereGeometry(0.06, 8, 6), lampMat, x, 0.33, z);
    boardGroup.add(pole, lamp);
    ambient.beacons.push({ mat: lampMat, phase: rand() * 6, speed: 0.6 + rand() * 0.8 });
  }
}

/* The energy core the player defends (the "crystal" in the rules) */
function buildCore() {
  const P = STYLE.palette;
  const cg = new THREE.Group();
  cg.position.copy(map.toWorld(map.crystalTile.c, map.crystalTile.r, PATH_H));
  const dark = STYLE.metal(P.gunmetal, 0.55, 0.7), steel = STYLE.metal(P.steel, 0.4, 0.8);
  const edgeMat = STYLE.glow(P.holo, 1.8);
  const basePlate = mesh(new THREE.CylinderGeometry(0.44, 0.5, 0.14, 6), dark, 0, 0.07, 0);
  const deckRing = mesh(new THREE.CylinderGeometry(0.36, 0.4, 0.05, 6), steel, 0, 0.165, 0);
  const edge = mesh(new THREE.TorusGeometry(0.43, 0.014, 4, 6), edgeMat, 0, 0.142, 0);
  edge.rotation.set(Math.PI / 2, 0, Math.PI / 2);
  const prongs = new THREE.Group();
  const prongGeo = new THREE.BoxGeometry(0.07, 0.6, 0.11);
  const tipGeo = new THREE.BoxGeometry(0.075, 0.07, 0.115);
  for (let i = 0; i < 3; i++) {
    const pv = new THREE.Group();
    pv.rotation.y = (i * Math.PI * 2) / 3 + Math.PI / 6;
    const pr = mesh(prongGeo, steel, 0, 0.45, 0.33);
    pr.rotation.x = -0.24;
    const tip = mesh(tipGeo, edgeMat, 0, 0.77, 0.255);
    tip.rotation.x = -0.24;
    pv.add(pr, tip);
    prongs.add(pv);
  }
  const cmat = new THREE.MeshStandardMaterial({ color: 0x9ff3ff, emissive: 0x2ad0ff, emissiveIntensity: 1.6, roughness: 0.1, metalness: 0.2, flatShading: true });
  const core = mesh(new THREE.OctahedronGeometry(0.24, 0), cmat, 0, 0.78, 0);
  core.scale.set(1, 1.5, 1);
  const ringA = mesh(new THREE.TorusGeometry(0.42, 0.011, 4, 56), STYLE.holo(P.holo, 0.6), 0, 0.78, 0);
  const ringB = mesh(new THREE.TorusGeometry(0.35, 0.009, 4, 56), STYLE.holo(P.rune, 0.9), 0, 0.78, 0);
  const runeDisc = mesh(new THREE.RingGeometry(0.5, 0.78, 48), STYLE.holo(P.rune, 0.55, runeTex), 0, 0.02, 0);
  runeDisc.rotation.x = -Math.PI / 2;
  const pool = mesh(new THREE.CircleGeometry(1.1, 32), STYLE.holo(P.holo, 0.16, dotTex), 0, 0.01, 0);
  pool.rotation.x = -Math.PI / 2;
  const light = new THREE.PointLight(0x5fe0ff, 7, 6, 1.6);
  light.position.y = 0.9;
  noShadow(ringA, ringB, runeDisc, pool, edge);
  shadowed(cg.add(basePlate, deckRing, edge, prongs));
  core.castShadow = true;
  cg.add(core, ringA, ringB, runeDisc, pool, light);
  boardGroup.add(cg);
  crystal = { group: cg, mesh: core, mat: cmat, light, halo: ringA, ringB, runeDisc, edgeMat, hurt: 0 };
}

/* The rift gate enemies come through (first waypoint, just off the board) */
function buildRiftGate() {
  const P = STYLE.palette;
  const pg = new THREE.Group();
  pg.position.copy(map.points[0]);
  const dark = STYLE.metal(P.gunmetal, 0.55, 0.7), steel = STYLE.metal(P.steel, 0.4, 0.8);
  const support = mesh(new THREE.BoxGeometry(0.92, 0.95, 1.2), STYLE.metal(0x1c232d, 0.7, 0.6), 0, -0.41, 0);
  const plinth = mesh(new THREE.BoxGeometry(0.92, 0.1, 1.2), dark, 0, 0.05, 0);
  const frame = mesh(new THREE.TorusGeometry(0.5, 0.075, 6, 6), steel, 0, 0.64, 0);
  frame.rotation.set(0, Math.PI / 2, Math.PI / 2);
  const ringMat = STYLE.glow(P.rune, 2.2);
  const ring = mesh(new THREE.TorusGeometry(0.42, 0.022, 6, 48), ringMat, 0, 0.64, 0);
  ring.rotation.y = Math.PI / 2;
  const swirl = mesh(new THREE.CircleGeometry(0.41, 40), STYLE.holo(0xb985ff, 0.85, swirlTex), 0, 0.64, 0);
  swirl.rotation.y = Math.PI / 2;
  const legGeo = new THREE.BoxGeometry(0.14, 0.62, 0.14);
  const legL = mesh(legGeo, steel, 0, 0.32, -0.48), legR = mesh(legGeo, steel, 0, 0.32, 0.48);
  const lampMat = STYLE.glow(P.rune, 2.6);
  const lampGeo = new THREE.BoxGeometry(0.1, 0.06, 0.1);
  const lampL = mesh(lampGeo, lampMat, 0, 0.66, -0.48), lampR = mesh(lampGeo, lampMat, 0, 0.66, 0.48);
  const runeDisc = mesh(new THREE.RingGeometry(0.4, 0.62, 40), STYLE.holo(P.rune, 0.5, runeTex), 0.05, 0.11, 0);
  runeDisc.rotation.x = -Math.PI / 2;
  const plight = new THREE.PointLight(0xa86bff, 3, 4, 1.8);
  plight.position.set(0.35, 0.6, 0);
  noShadow(swirl, runeDisc, ring);
  shadowed(pg.add(support, plinth, frame, legL, legR));
  pg.add(ring, swirl, lampL, lampR, runeDisc, plight);
  boardGroup.add(pg);
  portal = { group: pg, ring, ringMat, swirl, light: plight, runeDisc, lampMat };
}

/* Drifting spores and sparks over the board */
let fireflies = null;
function buildSpores() {
  const N = 52;
  const pos = new Float32Array(N * 3);
  const colr = new Float32Array(N * 3);
  const seeds = [];
  const rand = mulberry32(99);
  const c1 = new THREE.Color(0x5ff0d8), c2 = new THREE.Color(0xb88cff), c3 = new THREE.Color(0xd8ffb0);
  for (let i = 0; i < N; i++) {
    const s = { x: (rand() - 0.5) * (map.cols + 1), z: (rand() - 0.5) * (map.rows + 1), y: 0.5 + rand() * 1.3, p: rand() * 10, sp: 0.3 + rand() * 0.5 };
    seeds.push(s);
    const k = rand();
    const cc = k < 0.45 ? c1 : k < 0.75 ? c2 : c3;
    colr.set([cc.r, cc.g, cc.b], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colr, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.1, map: dotTex, vertexColors: true, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending }));
  boardGroup.add(pts);
  fireflies = { pts, seeds, pos };
}

/* =====================================================================
   EFFECTS — pooled additive particles
   ===================================================================== */
const Particles = (() => {
  const MAX = 900;
  const pos = new Float32Array(MAX * 3).fill(-999);
  const colr = new Float32Array(MAX * 3);
  const vel = new Float32Array(MAX * 3);
  const life = new Float32Array(MAX);
  const maxLife = new Float32Array(MAX);
  const base = new Float32Array(MAX * 3);
  const grav = new Float32Array(MAX);
  let cursor = 0;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colr, 3));
  const points = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.16, map: dotTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  points.frustumCulled = false;
  scene.add(points);
  const tmp = new THREE.Color();
  return {
    burst(at, { count = 12, color = 0xffffff, speed = 2, up = 1.5, lifeTime = 0.6, gravity = 6, spread = 1 } = {}) {
      tmp.set(color);
      count = Math.max(1, Math.round(count * Q.fx));
      for (let n = 0; n < count; n++) {
        const i = cursor; cursor = (cursor + 1) % MAX;
        const a = Math.random() * Math.PI * 2;
        const s = speed * (0.35 + Math.random() * 0.65);
        pos[i * 3] = at.x + (Math.random() - 0.5) * 0.1 * spread;
        pos[i * 3 + 1] = at.y + (Math.random() - 0.5) * 0.1 * spread;
        pos[i * 3 + 2] = at.z + (Math.random() - 0.5) * 0.1 * spread;
        vel[i * 3] = Math.cos(a) * s;
        vel[i * 3 + 1] = up * (0.4 + Math.random() * 0.8);
        vel[i * 3 + 2] = Math.sin(a) * s;
        maxLife[i] = life[i] = lifeTime * (0.6 + Math.random() * 0.6);
        grav[i] = gravity;
        base[i * 3] = tmp.r; base[i * 3 + 1] = tmp.g; base[i * 3 + 2] = tmp.b;
      }
    },
    /* One still particle that fades quickly: used for shot trails */
    trail(at, color, lifeTime = 0.16) {
      tmp.set(color);
      const i = cursor; cursor = (cursor + 1) % MAX;
      pos[i * 3] = at.x; pos[i * 3 + 1] = at.y; pos[i * 3 + 2] = at.z;
      vel[i * 3] = vel[i * 3 + 1] = vel[i * 3 + 2] = 0;
      maxLife[i] = life[i] = lifeTime;
      grav[i] = 0;
      base[i * 3] = tmp.r; base[i * 3 + 1] = tmp.g; base[i * 3 + 2] = tmp.b;
    },
    update(dt) {
      for (let i = 0; i < MAX; i++) {
        if (life[i] <= 0) continue;
        life[i] -= dt;
        if (life[i] <= 0) { pos[i * 3 + 1] = -999; colr[i * 3] = colr[i * 3 + 1] = colr[i * 3 + 2] = 0; continue; }
        vel[i * 3 + 1] -= grav[i] * dt;
        pos[i * 3] += vel[i * 3] * dt;
        pos[i * 3 + 1] += vel[i * 3 + 1] * dt;
        pos[i * 3 + 2] += vel[i * 3 + 2] * dt;
        if (pos[i * 3 + 1] < 0.02) { pos[i * 3 + 1] = 0.02; vel[i * 3 + 1] *= -0.3; vel[i * 3] *= 0.7; vel[i * 3 + 2] *= 0.7; }
        const k = life[i] / maxLife[i];
        colr[i * 3] = base[i * 3] * k; colr[i * 3 + 1] = base[i * 3 + 1] * k; colr[i * 3 + 2] = base[i * 3 + 2] * k;
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.color.needsUpdate = true;
    },
    clear() { life.fill(0); for (let i = 0; i < MAX; i++) pos[i * 3 + 1] = -999; colr.fill(0); },
  };
})();

/* Floating text (+5 coins, -1 life) drawn as HTML over the scene */
const Floaters = (() => {
  const layer = document.getElementById('floaters');
  const list = [];
  const v = new THREE.Vector3();
  return {
    add(text, at, cls) {
      const el = document.createElement('div');
      el.className = 'floater ' + (cls || '');
      el.textContent = text;
      layer.appendChild(el);
      list.push({ el, pos: at.clone(), t: 0, life: 0.95 });
    },
    update(dt) {
      for (let i = list.length - 1; i >= 0; i--) {
        const f = list[i];
        f.t += dt;
        f.pos.y += dt * 0.9;
        const k = f.t / f.life;
        if (k >= 1) { f.el.remove(); list.splice(i, 1); continue; }
        v.copy(f.pos).project(camera);
        const x = (v.x * 0.5 + 0.5) * innerWidth, y = (-v.y * 0.5 + 0.5) * innerHeight;
        const sc = k < 0.15 ? 0.7 + k * 2 : 1;
        f.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${sc})`;
        f.el.style.opacity = String(k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1);
      }
    },
    clear() { list.forEach((f) => f.el.remove()); list.length = 0; },
  };
})();

const bannerEl = document.getElementById('banner');

/* =====================================================================
   GAME STATE
   ===================================================================== */
const SIM_DT = 1 / 60;
let nextId = 1;
const state = {
  phase: 'title',   // title | ready | wave | won | lost
  paused: false,
  speed: Save.data.settings.speed === 2 ? 2 : 1,
  time: 0,
  lives: 0,
  coins: 0,
  waveIndex: 0,     // number of waves started
  spawners: [],
  enemies: [],
  towers: [],
  projectiles: [],
  stats: { kills: 0, earned: 0, leaked: 0 },
  endTimer: 0,
};

const tmpV = new THREE.Vector3();

/* Visual-only effects that outlive the game object (sold towers, dying enemies) */
const fx = { vanishing: [], dissolving: [] };
const scanRingGeo = new THREE.RingGeometry(0.86, 1, 6, 1);
function makeScanRing(color) {
  const r = new THREE.Mesh(scanRingGeo, STYLE.holo(color, 0.9));
  r.rotation.x = -Math.PI / 2;
  r.renderOrder = 7;
  scene.add(r);
  return r;
}
function clearFx() {
  for (const v of fx.vanishing) { scene.remove(v.mesh); scene.remove(v.ring); }
  for (const d of fx.dissolving) { scene.remove(d.mesh); scene.remove(d.ring); d.mats.forEach((m) => m.dispose()); }
  fx.vanishing.length = 0; fx.dissolving.length = 0;
}

function resetGame() {
  for (const e of state.enemies) removeEnemyMesh(e);
  for (const t of state.towers) { scene.remove(t.mesh); if (t.scanRing) scene.remove(t.scanRing); }
  for (const p of state.projectiles) releaseProjectileMesh(p.mesh);
  clearFx();
  state.enemies = [];
  state.towers = [];
  state.projectiles = [];
  state.spawners = [];
  state.time = 0;
  state.waveIndex = 0;
  state.lives = map.def.startLives;
  state.coins = map.def.startCoins;
  state.stats = { kills: 0, earned: 0, leaked: 0 };
  state.endTimer = 0;
  state.paused = false;
  Particles.clear();
  Floaters.clear();
  cancelBuild();
  deselect();
  if (crystal) { crystal.hurt = 0; crystal.group.scale.setScalar(1); }
  updateHud(true);
}

/* ---------- Waves ---------- */
function startWave() {
  if (state.phase !== 'ready') return;
  const wave = map.def.waves[state.waveIndex];
  if (!wave) return;
  state.spawners = wave.groups.map((g) => ({ enemy: g.enemy, remaining: g.count, interval: g.interval, timer: g.delay || 0 }));
  state.waveIndex++;
  state.phase = 'wave';
  const sub = wave.groups.map((g) => `${g.count} ${CONTENT.enemies[g.enemy].name}s`).join(' · ');
  banner(`WAVE ${state.waveIndex} INCOMING`, sub);
  Events.emit('waveStart', { index: state.waveIndex });
  updateHud();
}

function spawnEnemy(key) {
  const def = CONTENT.enemies[key];
  const bodyMat = new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.65 });
  const mesh = MODELS.enemies[def.model](def, bodyMat);
  const hb = makeHealthBar();
  mesh.add(hb.group);
  scene.add(mesh);
  const e = {
    id: nextId++, key, def, hp: def.health, maxHp: def.health, dist: 0, alive: true,
    pos: new THREE.Vector3(), prev: new THREE.Vector3(), yaw: 0,
    mesh, bodyMat, hb, flash: 0, anim: Math.random() * 6, spawnT: 0,
  };
  e.yaw = samplePath(map, 0, e.pos);
  e.prev.copy(e.pos);
  mesh.position.copy(e.pos);
  mesh.rotation.y = e.yaw;
  state.enemies.push(e);
  Particles.burst(tmpV.copy(e.pos).setY(0.64), { count: 12, color: 0xb985ff, speed: 1.4, up: 0.8, lifeTime: 0.5, gravity: 1 });
  Events.emit('enemySpawn', { enemy: e });
}

function removeEnemyMesh(e) {
  scene.remove(e.mesh);
  e.bodyMat.dispose();
  e.hb.group.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
}
/* Killed enemies de-materialise from the top down instead of vanishing */
function startDissolve(e) {
  e.hb.group.visible = false;
  const m = e.mesh;
  m.remove(e.hb.group);
  removeEnemyMesh(e);          // frees the health bar and skin material
  const mats = ownMaterials(m);
  const top = m.position.y + (m.userData.height || 0.6) * m.scale.y + 0.05;
  const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), top);
  mats.forEach((mt) => { mt.clippingPlanes = [clip]; mt.emissive && mt.emissive.setHex(STYLE.palette.holo); mt.emissiveIntensity = 0.6; });
  const ring = makeScanRing(STYLE.palette.holo);
  ring.scale.setScalar(0.34);
  scene.add(m);
  fx.dissolving.push({ mesh: m, mats, clip, ring, top, base: m.position.y, t: 0, dur: 0.38 });
}

function makeHealthBar() {
  const group = new THREE.Group();
  group.position.y = 0.82;
  const bg = new THREE.Mesh(new THREE.PlaneGeometry(0.52, 0.085), new THREE.MeshBasicMaterial({ color: 0x0a0d18, transparent: true, opacity: 0.75, depthTest: false }));
  const fillGeo = new THREE.PlaneGeometry(0.48, 0.05);
  fillGeo.translate(0.24, 0, 0);
  const fillMat = new THREE.MeshBasicMaterial({ color: 0x6dff9e, depthTest: false, transparent: true });
  const fill = new THREE.Mesh(fillGeo, fillMat);
  fill.position.set(-0.24, 0, 0.001);
  bg.renderOrder = 20; fill.renderOrder = 21;
  group.add(bg, fill);
  group.visible = false;
  return { group, fill, fillMat };
}

/* ---------- Damage ---------- */
function damageEnemy(e, amount, type, sourceTower) {
  if (!e.alive) return;
  const mult = e.def.resist && e.def.resist[type] != null ? e.def.resist[type] : 1;
  const dmg = Math.max(1, amount * mult - (e.def.armor || 0));
  e.hp -= dmg;
  e.flash = 1;
  Events.emit('enemyHit', { enemy: e, damage: dmg, type });
  if (e.hp <= 0) killEnemy(e, sourceTower);
}

function killEnemy(e, sourceTower) {
  e.alive = false;
  e.dissolve = true;
  state.coins += e.def.reward;
  state.stats.kills++;
  state.stats.earned += e.def.reward;
  if (sourceTower) sourceTower.kills++;
  const at = tmpV.copy(e.pos).setY(0.35);
  Particles.burst(at, { count: 10, color: e.def.color, speed: 1.8, up: 1.6, lifeTime: 0.5 });
  Particles.burst(at, { count: 8, color: STYLE.palette.holo, speed: 0.6, up: 2.4, lifeTime: 0.8, gravity: -0.5 });
  Particles.burst(at, { count: 6, color: 0xffcf5a, speed: 1, up: 2.6, lifeTime: 0.7, gravity: 4 });
  Floaters.add('+' + e.def.reward, at.clone().setY(0.8), 'gold');
  bumpPill('coins-pill');
  Events.emit('enemyKilled', { enemy: e });
}

function leak(e) {
  e.alive = false;
  state.lives = Math.max(0, state.lives - e.def.livesCost);
  state.stats.leaked++;
  crystal.hurt = 1;
  if (Save.data.settings.shake) camShake = Math.min(1, camShake + 0.55);
  const at = crystal.group.position.clone().setY(0.8);
  Particles.burst(at, { count: 20, color: 0xff5a6a, speed: 2.4, up: 2, lifeTime: 0.6 });
  Floaters.add('-' + e.def.livesCost, at.clone().setY(1.3), 'red');
  const pill = document.getElementById('lives-pill');
  pill.classList.remove('hurt'); void pill.offsetWidth; pill.classList.add('hurt');
  Events.emit('lifeLost', { enemy: e, lives: state.lives });
}

/* ---------- Towers ---------- */
function canBuildAt(c, r, key) {
  const def = CONTENT.towers[key];
  if (!map.inside(c, r)) return { ok: false, why: 'Off the board' };
  if (map.isPath(c, r)) return { ok: false, why: "Can't build on the path" };
  if (towerAt(c, r)) return { ok: false, why: 'Tile already taken' };
  if (state.coins < def.cost) return { ok: false, why: `Need ${def.cost - state.coins} more coins` };
  return { ok: true };
}
function towerAt(c, r) { return state.towers.find((t) => t.c === c && t.r === r) || null; }

function buildTower(c, r, key) {
  const def = CONTENT.towers[key];
  const mesh = MODELS.towers[def.model](def);
  const pos = map.toWorld(c, r, TILE_H);
  mesh.position.copy(pos);
  ownMaterials(mesh);
  const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), pos.y);
  mesh.traverse((o) => { if (o.material) o.material.clippingPlanes = [clip]; });
  scene.add(mesh);
  const scanRing = makeScanRing(def.color);
  scanRing.scale.setScalar(mesh.userData.radius || 0.45);
  const t = { id: nextId++, key, def, c, r, pos, mesh, clip, scanRing, cooldown: 0.45, targetId: 0, kills: 0, spent: def.cost, yaw: 0, recoil: 0, popT: 0 };
  mesh.userData.towerId = t.id;
  state.towers.push(t);
  state.coins -= def.cost;
  Particles.burst(tmpV.copy(pos).setY(TILE_H + 0.05), { count: 16, color: def.color, speed: 1.8, up: 0.5, lifeTime: 0.45, gravity: 2 });
  Particles.burst(tmpV.copy(pos).setY(0.5), { count: 10, color: STYLE.palette.rune, speed: 0.6, up: 2.2, lifeTime: 0.8, gravity: 0 });
  Events.emit('towerBuilt', { tower: t });
  updateHud();
  return t;
}

function sellTower(t) {
  const refund = Math.floor(t.spent * t.def.sellRefund);
  state.coins += refund;
  if (t.scanRing) { scene.remove(t.scanRing); t.scanRing = null; }
  const ring = makeScanRing(t.def.color);
  ring.scale.setScalar(t.mesh.userData.radius || 0.45);
  const top = t.pos.y + (t.mesh.userData.height || 1) + 0.05;
  t.clip.constant = top;
  t.mesh.traverse((o) => { if (o.material && o.material.emissive) { o.material.emissive.setHex(t.def.color); o.material.emissiveIntensity = Math.max(o.material.emissiveIntensity, 0.5); } });
  fx.vanishing.push({ mesh: t.mesh, clip: t.clip, ring, top, base: t.pos.y, t: 0, dur: 0.42 });
  state.towers = state.towers.filter((x) => x !== t);
  const at = t.pos.clone().setY(0.5);
  Particles.burst(at, { count: 14, color: 0xffcf5a, speed: 1.6, up: 2, lifeTime: 0.6 });
  Particles.burst(at, { count: 10, color: t.def.color, speed: 0.5, up: 2.4, lifeTime: 0.7, gravity: 0 });
  Floaters.add('+' + refund, at.clone().setY(1.1), 'gold');
  bumpPill('coins-pill');
  Events.emit('towerSold', { tower: t, refund });
  deselect();
  updateHud();
}

function findTarget(t) {
  const r2 = t.def.range * t.def.range;
  let best = null;
  for (const e of state.enemies) {
    if (!e.alive) continue;
    const dx = e.pos.x - t.pos.x, dz = e.pos.z - t.pos.z;
    if (dx * dx + dz * dz > r2) continue;
    if (!best || e.dist > best.dist) best = e;   // 'first' targeting
  }
  return best;
}

/* ---------- Projectiles (meshes are pooled) ---------- */
const projectilePool = [];
const arrowGeo = new THREE.CylinderGeometry(0.018, 0.018, 0.36, 5).rotateX(Math.PI / 2);
const tipGeo = new THREE.ConeGeometry(0.045, 0.11, 6).rotateX(Math.PI / 2).translate(0, 0, 0.22);
function getProjectileMesh(color) {
  let m = projectilePool.pop();
  if (!m) {
    m = new THREE.Group();
    const shaftMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
    const tipMat = new THREE.MeshBasicMaterial({ color, toneMapped: false });
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.scale.setScalar(0.42);
    glow.position.z = 0.18;
    m.add(new THREE.Mesh(arrowGeo, shaftMat), new THREE.Mesh(tipGeo, tipMat), glow);
    m.userData = { tipMat, glow };
  }
  m.userData.tipMat.color.set(color);
  m.userData.glow.material.color.set(color);
  m.visible = true;
  scene.add(m);
  return m;
}
function releaseProjectileMesh(m) { scene.remove(m); projectilePool.push(m); }

function fire(t, target) {
  const muzzle = new THREE.Vector3(t.pos.x, t.pos.y + t.mesh.userData.muzzleY, t.pos.z);
  const p = {
    tower: t, targetId: target.id, target, damage: t.def.damage, type: t.def.damageType, speed: t.def.projectileSpeed,
    pos: muzzle.clone(), prev: muzzle.clone(), aim: target.pos.clone().setY(target.pos.y + target.def.hitHeight),
    mesh: getProjectileMesh(t.def.color), age: 0,
  };
  p.mesh.position.copy(p.pos);
  p.mesh.lookAt(p.aim);
  state.projectiles.push(p);
  t.recoil = 1;
  Events.emit('towerFire', { tower: t });
}

/* =====================================================================
   SIMULATION STEP (fixed timestep)
   ===================================================================== */
function step(dt) {
  state.time += dt;

  // Spawning
  if (state.phase === 'wave') {
    for (const s of state.spawners) {
      if (s.remaining <= 0) continue;
      s.timer -= dt;
      if (s.timer <= 0) { spawnEnemy(s.enemy); s.remaining--; s.timer += s.interval; }
    }
  }

  // Enemies walk the path
  for (const e of state.enemies) {
    if (!e.alive) continue;
    e.prev.copy(e.pos);
    e.dist += e.def.speed * dt;
    e.yaw = samplePath(map, e.dist, e.pos);
    if (e.dist >= map.total) leak(e);
  }

  // Towers aim and fire
  for (const t of state.towers) {
    t.cooldown -= dt;
    const target = findTarget(t);
    t.targetId = target ? target.id : 0;
    if (target) {
      t.yaw = Math.atan2(target.pos.x - t.pos.x, target.pos.z - t.pos.z);
      if (t.cooldown <= 0) { fire(t, target); t.cooldown = 1 / t.def.fireRate; }
    } else if (t.cooldown < 0) {
      t.cooldown = 0;
    }
  }

  // Projectiles home in on their target
  for (const p of state.projectiles) {
    p.prev.copy(p.pos);
    p.age += dt;
    if (p.target.alive) p.aim.set(p.target.pos.x, p.target.pos.y + p.target.def.hitHeight, p.target.pos.z);
    const toAim = tmpV.subVectors(p.aim, p.pos);
    const d = toAim.length();
    const move = p.speed * dt;
    if (d <= move + 0.05) {
      p.pos.copy(p.aim);
      p.done = true;
      if (p.target.alive) damageEnemy(p.target, p.damage, p.type, p.tower);
      Particles.burst(p.pos, { count: 8, color: p.tower.def.color, speed: 2.8, up: 1.1, lifeTime: 0.26, gravity: 6 });
      Particles.burst(p.pos, { count: 3, color: 0xffffff, speed: 0.6, up: 0.4, lifeTime: 0.14, gravity: 0 });
    } else {
      p.pos.addScaledVector(toAim, move / d);
    }
    if (p.age > 4) p.done = true;
  }

  // Clean up
  state.enemies = state.enemies.filter((e) => {
    if (!e.alive) { if (e.dissolve) startDissolve(e); else removeEnemyMesh(e); return false; }
    return true;
  });
  state.projectiles = state.projectiles.filter((p) => {
    if (p.done) { releaseProjectileMesh(p.mesh); return false; }
    return true;
  });

  // Win / lose
  if (state.phase === 'wave') {
    if (state.lives <= 0) {
      state.phase = 'lost';
      state.endTimer = 0.9;
      Events.emit('defeat', {});
    } else {
      const spawningDone = state.spawners.every((s) => s.remaining <= 0);
      if (spawningDone && state.enemies.length === 0) {
        if (state.waveIndex >= map.def.waves.length) {
          state.phase = 'won';
          state.endTimer = 1.0;
          Events.emit('victory', {});
        } else {
          state.phase = 'ready';
          banner(`WAVE ${state.waveIndex} CLEARED`, 'Build up for the next one', 'clear');
          Events.emit('waveClear', { index: state.waveIndex });
        }
      }
    }
  }
}

/* =====================================================================
   INPUT — one pointer path for mouse and touch
   ===================================================================== */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -TILE_H);
let buildKey = null;            // tower type in build mode
let preview = null;             // { c, r } tile shown with ghost
let hoverTile = null;           // mouse hover tile
let selected = null;            // selected tower

function setNdc(e) {
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
}
function tileFromEvent(e) {
  setNdc(e);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(groundPlane, hit)) return null;
  const c = Math.floor(hit.x + map.cols / 2), r = Math.floor(hit.z + map.rows / 2);
  return { c, r, inside: map.inside(c, r) };
}
function pickTower(e) {
  setNdc(e);
  const hits = raycaster.intersectObjects(state.towers.map((t) => t.mesh), true);
  if (hits.length) {
    let o = hits[0].object;
    while (o && o.userData.towerId == null) o = o.parent;
    if (o) return state.towers.find((t) => t.id === o.userData.towerId) || null;
  }
  const tile = tileFromEvent(e);
  return tile && tile.inside ? towerAt(tile.c, tile.r) : null;
}

let down = null;
canvas.addEventListener('pointerdown', (e) => {
  down = { x: e.clientX, y: e.clientY, type: e.pointerType, button: e.button };
  canvas.focus({ preventScroll: true });
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  const tile = tileFromEvent(e);
  hoverTile = tile && tile.inside ? tile : null;
  let pointer = false;
  if (!buildKey && state.towers.length && !isUiBlocked()) pointer = !!pickTower(e);
  canvas.style.cursor = buildKey ? (hoverTile ? 'crosshair' : 'default') : pointer ? 'pointer' : 'default';
});
canvas.addEventListener('pointerleave', () => { hoverTile = null; });
canvas.addEventListener('pointerup', (e) => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  const wasRight = down.button === 2;
  down = null;
  if (moved > 14 || isUiBlocked()) return;
  if (wasRight) { cancelBuild(); deselect(); return; }
  handleTap(e);
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function isUiBlocked() { return state.phase === 'title' || state.phase === 'won' || state.phase === 'lost' || state.paused; }

function handleTap(e) {
  if (buildKey) {
    const tile = tileFromEvent(e);
    if (!tile || !tile.inside) { cancelBuild(); return; }
    const isTouch = e.pointerType !== 'mouse';
    if (isTouch && !(preview && preview.c === tile.c && preview.r === tile.r)) {
      preview = { c: tile.c, r: tile.r };   // first tap: preview only
      return;
    }
    tryBuild(tile.c, tile.r);
    return;
  }
  const t = pickTower(e);
  if (t) selectTower(t); else deselect();
}

function tryBuild(c, r) {
  const check = canBuildAt(c, r, buildKey);
  if (!check.ok) {
    toast(check.why, 'warn');
    highlightFlash = 1;
    return;
  }
  buildTower(c, r, buildKey);
  preview = null;
  if (state.coins < CONTENT.towers[buildKey].cost) cancelBuild();
}

function enterBuild(key) {
  if (isUiBlocked()) return;
  if (buildKey === key) { cancelBuild(); return; }
  deselect();
  buildKey = key;
  preview = null;
  const def = CONTENT.towers[key];
  if (state.coins < def.cost) toast(`Need ${def.cost - state.coins} more coins`, 'warn');
  setGhost(key);
  renderCards();
}
function cancelBuild() {
  buildKey = null;
  preview = null;
  setGhost(null);
  renderCards();
}

function selectTower(t) {
  selected = t;
  renderInfo();
}
function deselect() {
  selected = null;
  renderInfo();
}

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePause(); return; }
  if (isUiBlocked()) return;
  if (k === 'escape') { cancelBuild(); deselect(); }
  else if (k === 'f') toggleSpeed();
  else if (k === 'enter') startWave();
  else if (k === 's' && selected) sellTower(selected);
  else {
    for (const key of map.def.towers) if (CONTENT.towers[key].hotkey === k) enterBuild(key);
  }
});

/* =====================================================================
   HELPERS IN THE SCENE — tile highlight, range ring, build ghost
   ===================================================================== */
const highlight = new THREE.Mesh(new THREE.PlaneGeometry(0.98, 0.98), STYLE.holo(0x5dffb0, 0.8, holoTileTex));
highlight.rotation.x = -Math.PI / 2;
highlight.visible = false;
highlight.renderOrder = 5;
scene.add(highlight);
let highlightFlash = 0;

function makeRangeIndicator() {
  const g = new THREE.Group();
  const ringMat = STYLE.holo(0x58e6ff, 0.9);
  const discMat = STYLE.holo(0x58e6ff, 0.75, rangeTex);
  const sweepMat = STYLE.holo(0x58e6ff, 0.8, sweepTex);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.96, 1, 72), ringMat);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(1, 72), discMat);
  const sweep = new THREE.Mesh(new THREE.CircleGeometry(1, 72), sweepMat);
  ring.rotation.x = disc.rotation.x = sweep.rotation.x = -Math.PI / 2;
  sweep.position.y = 0.002;
  ring.renderOrder = disc.renderOrder = sweep.renderOrder = 6;
  g.add(disc, sweep, ring);
  g.visible = false;
  g.userData = { ring, ringMat, discMat, sweep, sweepMat, radius: 0 };
  scene.add(g);
  return g;
}
const rangeIndicator = makeRangeIndicator();
function showRange(at, radius, color) {
  const u = rangeIndicator.userData;
  if (u.radius !== radius) {
    u.ring.geometry.dispose();
    u.ring.geometry = new THREE.RingGeometry(1 - 0.045 / radius, 1, 72);
    u.radius = radius;
  }
  rangeIndicator.scale.set(radius, 1, radius);
  rangeIndicator.position.set(at.x, TILE_H + 0.012, at.z);
  u.ringMat.color.set(color);
  u.discMat.color.set(color);
  u.sweepMat.color.set(color);
  rangeIndicator.visible = true;
}

let ghost = null;
const ghostCache = {};
function setGhost(key) {
  if (ghost) { scene.remove(ghost); ghost = null; }
  if (!key) return;
  if (!ghostCache[key]) {
    const def = CONTENT.towers[key];
    const g = MODELS.towers[def.model](def);
    g.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = false;
        o.material = o.material.clone();
        o.material.transparent = true;
        o.material.opacity = 0.45;
        o.material.depthWrite = false;
        if (o.material.emissive) { o.material.emissive.setHex(def.color); o.material.emissiveIntensity = Math.max(0.35, o.material.emissiveIntensity); }
      }
    });
    ghostCache[key] = g;
  }
  ghost = ghostCache[key];
  ghost.visible = false;
  scene.add(ghost);
}

const placeHint = document.getElementById('place-hint');

function updateHelpers(dt, t) {
  highlightFlash = Math.max(0, highlightFlash - dt * 3);
  rangeIndicator.userData.sweep.rotation.z -= dt * 1.6;
  let showTile = null;
  if (buildKey) showTile = preview || hoverTile;
  if (showTile && !isUiBlocked()) {
    const p = map.toWorld(showTile.c, showTile.r);
    const check = canBuildAt(showTile.c, showTile.r, buildKey);
    const y = map.isPath(showTile.c, showTile.r) ? PATH_H : TILE_H;
    highlight.position.set(p.x, y + 0.01, p.z);
    highlight.material.color.set(check.ok ? 0x5dffb0 : 0xff4d5e);
    highlight.material.opacity = 0.7 + Math.sin(t * 6) * 0.18 + highlightFlash * 0.6;
    highlight.visible = true;
    const def = CONTENT.towers[buildKey];
    const occupied = towerAt(showTile.c, showTile.r);
    if (ghost) {
      ghost.visible = !occupied && !map.isPath(showTile.c, showTile.r);
      ghost.position.set(p.x, TILE_H, p.z);
      ghost.userData.head.rotation.y = t * 0.8;
    }
    showRange(p, def.range, check.ok ? 0x58e6ff : 0xff5f74);
    // Touch: label telling the player to tap again
    if (preview) {
      const v = tmpV.set(p.x, TILE_H + 1.25, p.z).project(camera);
      placeHint.hidden = false;
      placeHint.className = check.ok ? '' : 'bad';
      placeHint.textContent = check.ok ? `Tap again to build · ${def.cost}` : check.why;
      placeHint.style.transform = `translate(${(v.x * 0.5 + 0.5) * innerWidth}px, ${(-v.y * 0.5 + 0.5) * innerHeight}px) translate(-50%, -100%)`;
    } else placeHint.hidden = true;
  } else {
    highlight.visible = false;
    if (ghost) ghost.visible = false;
    placeHint.hidden = true;
    if (selected) showRange(selected.pos, selected.def.range, 0x58e6ff);
    else rangeIndicator.visible = false;
  }
}
